name: Inspect Android runtime materials
on:
  workflow_dispatch:
  push:
    branches:
    - collab/distribution-materials-20261017
    paths:
    - .github/workflows/android-runtime-materials.yml
    - scripts/ci/android_runtime_materials.init.gradle
    - scripts/ci/android_runtime_materials.py
    - scripts/ci/test_android_runtime_materials.py
permissions:
  contents: read
jobs:
  inspect_android_runtime:
    name: Resolve both unsigned Android runtime graphs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        submodules: false
        persist-credentials: false
    - name: Checkout exact Android source
      run: git submodule update --init clients/android
    - name: Apply the same unsigned client overlay
      run: python scripts/ci/unsigned_clients.py android
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Resolve without compiling APKs or libbox
      working-directory: clients/android
      run: |
        mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"
        status=0
        for variant in other otherLegacy; do
          export POLARIS_ANDROID_RUNTIME_CONFIGURATION="${variant}ReleaseRuntimeClasspath"
          export POLARIS_ANDROID_RUNTIME_OUTPUT="$GITHUB_WORKSPACE/runtime-evidence/${variant}.json"
          if ./gradlew --no-daemon --init-script ../../scripts/ci/android_runtime_materials.init.gradle :app:polarisRuntimeMaterials; then
            code=0
          else
            code=$?
            status=1
          fi
          printf '%s\t%s\n' "$variant" "$code" >> "$GITHUB_WORKSPACE/runtime-evidence/resolution-status.tsv"
        done
        exit "$status"
    - name: Bind resolution evidence to this source and run
      if: always()
      run: |
        python - <<'PYTHON'
        import os,subprocess,sys
        sys.path.insert(0,'scripts/ci')
        from android_runtime_materials import write_diagnostic
        from client_source import collect
        try:
            client=collect('android',True)
        except Exception:
            client=None
        metadata={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'runId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']}
        sys.exit(0 if write_diagnostic('runtime-evidence',metadata,client) else 1)
        PYTHON
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-runtime-resolution-evidence
        path: |
          runtime-evidence/other.json
          runtime-evidence/otherLegacy.json
          runtime-evidence/receipt.json
          runtime-evidence/diagnostics.json
          runtime-evidence/resolution-status.tsv
        if-no-files-found: error
