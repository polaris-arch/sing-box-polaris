name: Dots fixed dependency materialization
on:
  push:
    branches: [collab/dots-audit-remediation-20261017]
    paths: [.github/workflows/dots-baseline-materialize.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Fetch checksum-verified fixed upstream module
        env:
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
        run: |
          mkdir -p module-evidence
          go mod download -json github.com/sagernet/sing-tun@v0.9.7-0.20261013140216-9ffa5391a2ad > module-evidence/download.json
          python3 - <<'PY'
          import json, pathlib, shutil, hashlib
          p=pathlib.Path('module-evidence')
          d=json.loads((p/'download.json').read_text())
          assert not d.get('Error'), d.get('Error')
          assert d['Path']=='github.com/sagernet/sing-tun'
          assert d['Version']=='v0.9.7-0.20261013140216-9ffa5391a2ad'
          result={}
          for field,name in [('Zip','sing-tun.zip'),('GoMod','sing-tun.mod'),('Info','sing-tun.info')]:
              target=p/name
              shutil.copyfile(d[field],target)
              data=target.read_bytes()
              result[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (p/'FILE-HASHES.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          go version > module-evidence/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dots-sing-tun-9ffa-source
          path: module-evidence/
          if-no-files-found: error
          retention-days: 7
