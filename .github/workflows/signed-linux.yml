name: Signed Linux packages and explicit owned repository upload
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-audit-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 0
    - name: Verify owned distribution configuration
      run: python3 scripts/ci/owned_distribution.py verify
    - name: Setup Go
      if: github.event_name != 'workflow_dispatch'
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
    - name: Check input version
      if: github.event_name == 'workflow_dispatch'
      run: |
        python3 scripts/ci/polaris_version.py "$CANDIDATE_VERSION"
        printf "version=%s\n" "$CANDIDATE_VERSION" >> "$GITHUB_ENV"
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
    - name: Calculate version
      if: github.event_name != 'workflow_dispatch'
      run: go run -v ./cmd/internal/read_tag --ci --nightly
    - name: Set outputs
      id: outputs
      run: echo "version=$version" >> "$GITHUB_OUTPUT"
    environment: polaris-distribution
    if: github.repository == 'polaris-arch/sing-box-polaris' && vars.POLARIS_DISTRIBUTION_ENABLED == 'true'
  build:
    name: Build binary
    runs-on: ubuntu-26.04
    needs:
    - calculate_version
    strategy:
      matrix:
        include:
        - os: linux
          arch: amd64
          naive: true
          debian: amd64
          rpm: x86_64
          pacman: x86_64
        - os: linux
          arch: arm64
          naive: true
          debian: arm64
          rpm: aarch64
          pacman: aarch64
        - os: linux
          arch: '386'
          naive: true
          debian: i386
          rpm: i386
        - os: linux
          arch: arm
          goarm: '7'
          naive: true
          debian: armhf
          rpm: armv7hl
          pacman: armv7hl
        - os: linux
          arch: mipsle
          gomips: softfloat
          naive: true
          debian: mipsel
          rpm: mipsel
        - os: linux
          arch: riscv64
          naive: true
          debian: riscv64
          rpm: riscv64
        - os: linux
          arch: loong64
          naive: true
          debian: loongarch64
          rpm: loongarch64
        - os: linux
          arch: arm
          goarm: '6'
          debian: armel
          rpm: armv6hl
        - os: linux
          arch: mips64le
          debian: mips64el
          rpm: mips64el
        - os: linux
          arch: s390x
          debian: s390x
          rpm: s390x
        - os: linux
          arch: ppc64le
          debian: ppc64el
          rpm: ppc64le
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
    - name: Clone cronet-go
      if: matrix.naive
      run: |
        set -xeuo pipefail
        CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
        git init ~/cronet-go
        git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
        git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
        git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C ~/cronet-go checkout FETCH_HEAD
        git -C ~/cronet-go submodule update --init --recursive --depth=1
    - name: Regenerate Debian keyring
      if: matrix.naive
      run: |
        set -xeuo pipefail
        rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
        cd ~/cronet-go
        GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
    - name: Cache Chromium toolchain
      if: matrix.naive
      id: cache-chromium-toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/cronet-go/naiveproxy/src/third_party/llvm-build/
          ~/cronet-go/naiveproxy/src/gn/out/
          ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
          ~/cronet-go/naiveproxy/src/out/sysroot-build/
        key: chromium-toolchain-${{ matrix.arch }}-musl-${{ hashFiles('.github/CRONET_GO_VERSION') }}
    - name: Download Chromium toolchain
      if: matrix.naive
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
    - name: Set Chromium toolchain environment
      if: matrix.naive
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV
    - name: Set tag
      run: |-
        git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
        git tag v${{ needs.calculate_version.outputs.version }} -f
    - name: Set build tags
      run: |
        set -xeuo pipefail
        if [[ "${{ matrix.naive }}" == "true" ]]; then
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_musl"
        else
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
        fi
        echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
    - name: Set shared ldflags
      run: |
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.SourceRevision=$GITHUB_SHA" >> "${GITHUB_ENV}"
    - name: Build (naive)
      if: matrix.naive
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
        GOMIPS64: ${{ matrix.gomips }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build (non-naive)
      if: ${{ ! matrix.naive }}
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        GOARM: ${{ matrix.goarm }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Set mtime
      run: TZ=UTC touch -t '197001010000' dist/sing-box
    - name: Detect track
      run: bash .github/detect_track.sh
    - name: Set version
      run: |-
        PKG_VERSION="${{ needs.calculate_version.outputs.version }}"
        PKG_VERSION="${PKG_VERSION//-/\~}"
        echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"
    - name: Install shared package tool
      if: matrix.debian != '' || matrix.rpm != '' || matrix.pacman != ''
      run: sudo gem install fpm
    - name: Setup package signing
      if: matrix.debian != '' || matrix.rpm != ''
      run: |-
        set -euo pipefail
        umask 077
        SIGNING_GNUPG_HOME="$RUNNER_TEMP/package-signing-gnupg"
        SIGNING_PASSPHRASE_FILE="$RUNNER_TEMP/package-signing-passphrase"
        mkdir -m 700 "$SIGNING_GNUPG_HOME"
        printf '%s' "$GPG_PASSPHRASE" > "$SIGNING_PASSPHRASE_FILE"
        chmod 600 "$SIGNING_PASSPHRASE_FILE"
        {
          echo "GNUPGHOME=$SIGNING_GNUPG_HOME"
          echo "SIGNING_PASSPHRASE_FILE=$SIGNING_PASSPHRASE_FILE"
        } >> "$GITHUB_ENV"
        printf '%s' "$GPG_KEY" | gpg \
          --homedir "$SIGNING_GNUPG_HOME" \
          --batch \
          --pinentry-mode loopback \
          --passphrase-file "$SIGNING_PASSPHRASE_FILE" \
          --import
        cat > "$HOME/.rpmmacros" <<EOF
        %_gpg_name $GPG_KEY_ID
        %_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE
        EOF
      env:
        GPG_KEY: ${{ secrets.GPG_KEY }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    - name: Package DEB
      if: matrix.debian != ''
      run: |
        set -xeuo pipefail
        sudo apt-get install -y debsigs
        cp .fpm_systemd .fpm
        fpm -t deb \
          --name "${PACKAGE_NAME}" \
          -v "$PKG_VERSION" \
          -p "dist/${NAME}_${{ needs.calculate_version.outputs.version }}_linux_${{ matrix.debian }}.deb" \
          --architecture ${{ matrix.debian }} \
          dist/sing-box=/usr/bin/sing-box
        debsigs --sign=origin -k "$GPG_KEY_ID" \
          --gpgopts "--batch --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE" dist/*.deb
      env:
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    - name: Package RPM
      if: matrix.rpm != ''
      run: |-
        set -xeuo pipefail
        echo '%_rpmformat 4' >> "$HOME/.rpmmacros"
        cp .fpm_systemd .fpm
        fpm -t rpm \
          --name "${PACKAGE_NAME}" \
          -v "$PKG_VERSION" \
          -p "dist/${NAME}_${{ needs.calculate_version.outputs.version }}_linux_${{ matrix.rpm }}.rpm" \
          --architecture ${{ matrix.rpm }} \
          dist/sing-box=/usr/bin/sing-box
        rpmsign --addsign dist/*.rpm
    - name: Cleanup
      run: rm dist/sing-box
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}
        path: dist
        if-no-files-found: error
    environment: polaris-distribution
    if: github.repository == 'polaris-arch/sing-box-polaris' && vars.POLARIS_DISTRIBUTION_ENABLED == 'true'
  upload:
    name: Upload builds
    runs-on: ubuntu-latest
    needs:
    - calculate_version
    - build
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 0
    - name: Set tag
      run: |-
        git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
        git tag v${{ needs.calculate_version.outputs.version }} -f
        echo "VERSION=${{ needs.calculate_version.outputs.version }}" >> "$GITHUB_ENV"
    - name: Download builds
      uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true
    - name: Publish packages
      if: github.event_name != 'push'
      run: python3 scripts/ci/owned_distribution.py publish-packages
      env:
        FURY_TOKEN: ${{ secrets.POLARIS_FURY_TOKEN }}
    environment: polaris-distribution
    if: github.repository == 'polaris-arch/sing-box-polaris' && vars.POLARIS_DISTRIBUTION_ENABLED == 'true' && inputs.publish_packages
'on':
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: 1.15.0-polaris-alpha.12
      publish_packages:
        type: boolean
        default: false
        description: Publish signed packages to the reviewed owned Gemfury account
permissions:
  contents: read
