name: Lint
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref_type == 'branch' && format('tip-{0}', github.ref) || format('audit-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}
jobs:
  classify:
    name: Audit CI impact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_full: ${{ steps.impact.outputs.run_full }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove conservative impact policy
        run: python3 -B -m unittest discover -s scripts -p 'test_polaris_ci_impact.py' -v
      - id: impact
        name: Classify exact automatic tip or keep fixed audit full
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 -B scripts/polaris_ci_impact.py --repo "$GITHUB_WORKSPACE" \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" --ref "$EVENT_REF" \
            --workflow-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ci-impact.json" --github-output "$GITHUB_OUTPUT"
  build:
    needs: classify
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    name: Lint ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: windows
          goarch: amd64
        - goos: windows
          goarch: '386'
        - goos: windows
          goarch: arm64
        - goos: linux
          goarch: amd64
        - goos: linux
          goarch: arm64
        - goos: linux
          goarch: arm
        - goos: linux
          goarch: '386'
        - goos: darwin
          goarch: amd64
        - goos: darwin
          goarch: arm64
        - goos: android
          goarch: arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache-dependency-path: |
          go.mod
          go.sum
          third_party/sing-tun/go.mod
          third_party/sing-tun/go.sum
          third_party/metacubex-utls/go.mod
          third_party/metacubex-utls/go.sum
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      with:
        version: v2.15.0
        args: --timeout=30m --max-same-issues=0 --max-issues-per-linter=0
        install-mode: binary
        verify: false
'on':
  workflow_dispatch: {}
  push:
    branches:
    - polaris-main
  pull_request:
    branches:
    - polaris-main
permissions:
  contents: read
