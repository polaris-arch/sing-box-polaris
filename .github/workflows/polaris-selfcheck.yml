# Answers one question for a commit of the Polaris patch queue: can it be
# built for the five targets the app consumes, and do the patches' own tests
# pass. Nothing built here is released or consumed.
#
# Select source_role=desktop for the four desktop targets and Windows/patch
# tests, or source_role=mobile for Android/iOS and patch tests. Each role uses
# its own source_commit; all preserves the complete default push gate.
#
# Expected libbox symbols: a push always expects the six mobile symbols. The
# desktop consumption point and the bare upstream baseline do not have them,
# so check those with a manual run, source_commit set to their full SHA, and
# expected_symbols set to none. source_commit pins every checkout; github.sha
# identifies the workflow revision, not necessarily the source under test.
#
# The macOS and iOS jobs run on macos-latest, while upstream builds its Apple
# library on a different runner image. Their first run result is still to be
# confirmed.
#
# Go, JDK and NDK follow the app's source manifest, not the upstream workflows.
name: Polaris self-check

on:
  push:
    branches:
      - polaris-main
    tags:
      - 'polaris-*'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full 40-hex source commit in this fork; empty tests the workflow revision'
        type: string
        default: ''
      expected_symbols:
        description: 'Expected libbox symbols: mobile, or none for the desktop point and the bare baseline'
        type: choice
        default: mobile
        options:
          - mobile
          - none
      source_role:
        description: 'Platform gates for this source role; all retains the default complete self-check'
        type: choice
        default: all
        options:
          - all
          - desktop
          - mobile
      base_ref:
        description: 'Upstream baseline tag the queue is stacked on'
        type: string
        default: v1.15.0-alpha.12
      base_commit:
        description: 'Exact peeled upstream baseline commit; historical base_ref requires its matching SHA'
        type: string
        default: '25b0d5ea3e466d246c708ac0f20d0448110e566c'
      patch_only:
        description: 'Manual dispatch only: run the unchanged Patch tests job without platform builds'
        type: boolean
        default: false
      run_instance_tests:
        description: 'Also run the tests that start an instance in process'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Only future automatic branch-tip runs supersede older tips. Manual fixed
  # source audits and tag milestones never share that cancellation group.
  group: polaris-selfcheck-${{ github.event_name == 'push' && github.ref_type == 'branch' && format('tip-{0}', github.ref) || format('audit-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

env:
  SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local
  BASE_REF: ${{ inputs.base_ref || 'v1.15.0-alpha.12' }}
  BASE_COMMIT: ${{ inputs.base_commit || '25b0d5ea3e466d246c708ac0f20d0448110e566c' }}
  EXPECTED_SYMBOLS: ${{ inputs.expected_symbols || 'mobile' }}
  # NDK 30.0.16138531-beta3, as pinned by the app's ndk-linux-archive.json.
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r30-beta3-linux.zip
  NDK_SHA256: 2698cca1e9f161048ecd84e1e70a556e1aa00b78409473d4c1e87969d40c3efc
  NDK_ROOT: android-ndk-r30-beta3
  # These tests start an instance in process, except the last one, which
  # constructs a TUN inbound without starting it. None of them has run on this
  # baseline yet, so they are kept out of the default gate.
  INSTANCE_TESTS: >-
    TestTransientCommandServerPreservesSharedState|TestCommandServerRetainsSharedDiagnostics|TestTransientCommandServerCloseKeepsPrimaryService|TestStrictPrimaryReloadThenFinalCloseIsTerminal|TestStrictPrimaryCloseWaitsForInFlightCommandStartBeforeAcknowledging|TestStrictPrimaryFailedOldCloseBlocksReloadAndRepeatsStickyFailure|TestTransientHTTPInboundRejectsMissingAndWrongSpeedtestCredentials|TestStrictTransientEarlyStartCleanupFailureBecomesSticky|TestUnstartedTUNValidationCannotDeleteOtherInstanceRules

  # These nested tests create real TUNs (including the memory-link fixtures),
  # modify OS networking, or need ICMP permissions (including TestIsClosed's
  # Linux raw-socket ConnectDestination path). Default compilation
  # still includes every test; execution requires run_instance_tests. TestPing's
  # unprivileged cases are run separately in the default gate.
  SING_TUN_INSTANCE_TESTS: >-
    TestAddDeleteIPAddress|TestAddDeleteRoute|TestFlushDNS|TestGoConnBuffers|TestGoConnKeepalive|TestGoConnLinger|TestGoConnNoDelay|TestGoKernelBidirectionalLoss|TestGoKernelClose|TestGoKernelDeadline|TestGoKernelDeviceBackpressure|TestGoKernelFlowControl|TestGoKernelHalfClose|TestGoKernelHandshake|TestGoKernelHandshakeLoss|TestGoKernelLinkInterruption|TestGoKernelPacket|TestGoKernelPacketBatchIdle|TestGoKernelPacketBuffer|TestGoKernelPacketFragments|TestGoKernelPacketLifetime|TestGoKernelPacketMapping|TestGoKernelPacketOffload|TestGoKernelPacketRead|TestGoKernelPacketTimeout|TestGoKernelPacketWriteAfterClose|TestGoKernelReceiveWindowUpdateLoss|TestGoKernelSACKReneging|TestGoKernelSequenceWrap|TestGoKernelSpliceOwnership|TestGoKernelStream|TestGoKernelTCPLifecycle|TestGoKernelTCPRecovery|TestGoKernelTCPSendBudget|TestGoKernelTCPTransmitLifetime|TestGoKernelTCPWaiting|TestGoKernelWindowClamp|TestGoKernelWindowLimitedRecovery|TestGoKernelZeroWindow|TestGoKernelZeroWindowHalfClose|TestGoListenPrecedence|TestGoListenTCP|TestGoListenUDPPort|TestGoMemoryControlPriority|TestGoMemoryDial|TestGoMemoryMTUUpdate|TestGoMemoryNoHandler|TestGoMemoryOutboundBound|TestGoMemoryOutboundReply|TestGoMemoryPathMTU|TestGoMemoryUDP|TestGoUDPReadBuffer|TestIPChangeMTU|TestIPChangeMetric|TestIsClosed|TestNetworkUpdateMonitorReceiveOverrun|TestPing|TestSetDNS

jobs:
  classify:
    name: Audit CI impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_full: ${{ steps.impact.outputs.run_full }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove conservative impact policy
        run: python3 -B -m unittest discover -s scripts -p 'test_polaris_ci_impact.py' -v
      - id: impact
        name: Classify exact automatic tip or keep fixed audit full
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 -B scripts/polaris_ci_impact.py --repo "$GITHUB_WORKSPACE" \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" --ref "$EVENT_REF" \
            --workflow-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ci-impact.json" --github-output "$GITHUB_OUTPUT"
      - name: Preserve exact impact decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-ci-impact-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-impact.json
          if-no-files-found: warn
          retention-days: 14
  linux:
    needs: classify
    timeout-minutes: 90
    if: ${{ needs.classify.outputs.run_full == 'true' && ((github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'mobile') }}
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Start shared job clock before checkout and preparation
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          runner_bash="$BASH"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_bash="$(cygpath -w "$BASH")"
          fi
          test -n "$runner_bash"
          POLARIS_RUNNER_BASH="$runner_bash" python -B - <<'PYBUDGET'
          import json, os, time
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'polaris-ci-job-budget.json'
          path.write_text(json.dumps({'schema':'polaris-ci-job-budget-v1','startedMonotonic':time.monotonic(),
              'jobSeconds':5400,'evidenceReserveSeconds':900,'safetySeconds':60})+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('POLARIS_JOB_BUDGET='+str(path)+'\n')
              stream.write('POLARIS_RUNNER_BASH='+os.environ['POLARIS_RUNNER_BASH']+'\n')
          PYBUDGET
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - name: Bound runner work using the fixed workflow-owned resource tool
        timeout-minutes: 5
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$GITHUB_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          fi
          git show "$GITHUB_SHA:scripts/polaris_runner_resources.py" > "$RUNNER_TEMP/polaris-runner-resources.py"
          git show "$GITHUB_SHA:scripts/polaris_ci_observe.py" > "$RUNNER_TEMP/polaris-ci-observe.py"
          git show "$GITHUB_SHA:scripts/polaris_ci_downloads.py" > "$RUNNER_TEMP/polaris-ci-downloads.py"
          python -B "$RUNNER_TEMP/polaris-runner-resources.py" \
            --kind selfcheck --scratch "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/polaris-runner-budget.json" --github-env "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/polaris-command-selfcheck-linux-0.sh" <<'POLARIS_COMMAND'
          GOMAXPROCS="$POLARIS_COMPILE_GOMAXPROCS" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null \
            -tags "$(cat release/DEFAULT_BUILD_TAGS),with_gvisor,with_purego" \
            -ldflags "$(cat release/LDFLAGS)" ./cmd/sing-box

          POLARIS_COMMAND
          python -B "$RUNNER_TEMP/polaris-ci-observe.py" --phase selfcheck-linux-0 \
            --output "$RUNNER_TEMP/polaris-ci/selfcheck-linux-0" --timeout-seconds 4500 \
            -- "$POLARIS_RUNNER_BASH" --noprofile --norc -e -o pipefail "$RUNNER_TEMP/polaris-command-selfcheck-linux-0.sh"
      - name: Preserve command, failure and resource observations
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-ci-linux-host-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/polaris-ci
            ${{ runner.temp }}/polaris-ci-job-budget.json
            ${{ runner.temp }}/polaris-runner-budget.json
          if-no-files-found: warn
          retention-days: 14
