# Answers one question for a commit of the Polaris patch queue: can it be
# built for the five targets the app consumes, and do the patches' own tests
# pass. Nothing built here is released or consumed.
#
# Select source_role=desktop for the four desktop targets and Windows/patch
# tests, or source_role=mobile for Android/iOS and patch tests. Each role uses
# its own source_commit; all preserves the complete default manual and PR gate.
#
# Expected libbox symbols: a tag push expects the six mobile symbols. The
# desktop consumption point and the bare upstream baseline do not have them,
# so check those with a manual run, source_commit set to their full SHA, and
# expected_symbols set to none. source_commit pins every checkout; github.sha
# identifies the workflow revision, not necessarily the source under test.
#
# Apple build checks use the supported Intel image to avoid the hosted arm64
# capacity queue. Both Darwin architectures and the iOS arm64 library remain
# covered; native monitor race tests run on the Intel host.
#
# Go, JDK and NDK follow the app's source manifest, not the upstream workflows.
name: Polaris self-check

on:
  push:
    tags:
      - 'polaris-*'
  pull_request:
    branches: [polaris-main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full 40-hex source commit in this fork; empty tests the workflow revision'
        type: string
        default: ''
      expected_symbols:
        description: 'Expected libbox symbols: mobile, or none for the desktop point and the bare baseline'
        type: choice
        default: mobile
        options:
          - mobile
          - none
      source_role:
        description: 'Platform gates for this source role; all retains the default complete self-check'
        type: choice
        default: all
        options:
          - all
          - desktop
          - mobile
      base_ref:
        description: 'Upstream baseline tag the queue is stacked on'
        type: string
        default: v1.15.0-alpha.12
      base_commit:
        description: 'Exact peeled upstream baseline commit; historical base_ref requires its matching SHA'
        type: string
        default: '25b0d5ea3e466d246c708ac0f20d0448110e566c'
      patch_only:
        description: 'Manual dispatch only: run the unchanged Patch tests job without platform builds'
        type: boolean
        default: false
      run_instance_tests:
        description: 'Also run the tests that start an instance in process'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: polaris-selfcheck-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref_type == 'branch' && format('tip-{0}', github.ref) || format('audit-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

defaults:
  run:
    shell: bash

env:
  SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local
  BASE_REF: ${{ inputs.base_ref || 'v1.15.0-alpha.12' }}
  BASE_COMMIT: ${{ inputs.base_commit || '25b0d5ea3e466d246c708ac0f20d0448110e566c' }}
  EXPECTED_SYMBOLS: ${{ inputs.expected_symbols || 'mobile' }}
  # These tests start an instance in process, except the last one, which
  # constructs a TUN inbound without starting it. None of them has run on this
  # baseline yet, so they are kept out of the default gate.
  INSTANCE_TESTS: >-
    TestTransientCommandServerPreservesSharedState|TestCommandServerRetainsSharedDiagnostics|TestTransientCommandServerCloseKeepsPrimaryService|TestStrictPrimaryReloadThenFinalCloseIsTerminal|TestStrictPrimaryCloseWaitsForInFlightCommandStartBeforeAcknowledging|TestStrictPrimaryFailedOldCloseBlocksReloadAndRepeatsStickyFailure|TestTransientHTTPInboundRejectsMissingAndWrongSpeedtestCredentials|TestStrictTransientEarlyStartCleanupFailureBecomesSticky|TestUnstartedTUNValidationCannotDeleteOtherInstanceRules

  # These nested tests create real TUNs (including the memory-link fixtures),
  # modify OS networking, or need ICMP permissions (including TestIsClosed's
  # Linux raw-socket ConnectDestination path). Default compilation
  # still includes every test; execution requires run_instance_tests. TestPing's
  # unprivileged cases are run separately in the default gate.
  SING_TUN_INSTANCE_TESTS: >-
    TestAddDeleteIPAddress|TestAddDeleteRoute|TestFlushDNS|TestGoConnBuffers|TestGoConnKeepalive|TestGoConnLinger|TestGoConnNoDelay|TestGoKernelBidirectionalLoss|TestGoKernelClose|TestGoKernelDeadline|TestGoKernelDeviceBackpressure|TestGoKernelFlowControl|TestGoKernelHalfClose|TestGoKernelHandshake|TestGoKernelHandshakeLoss|TestGoKernelLinkInterruption|TestGoKernelPacket|TestGoKernelPacketBatchIdle|TestGoKernelPacketBuffer|TestGoKernelPacketFragments|TestGoKernelPacketLifetime|TestGoKernelPacketMapping|TestGoKernelPacketOffload|TestGoKernelPacketRead|TestGoKernelPacketTimeout|TestGoKernelPacketWriteAfterClose|TestGoKernelReceiveWindowUpdateLoss|TestGoKernelSACKReneging|TestGoKernelSequenceWrap|TestGoKernelSpliceOwnership|TestGoKernelStream|TestGoKernelTCPLifecycle|TestGoKernelTCPRecovery|TestGoKernelTCPSendBudget|TestGoKernelTCPTransmitLifetime|TestGoKernelTCPWaiting|TestGoKernelWindowClamp|TestGoKernelWindowLimitedRecovery|TestGoKernelZeroWindow|TestGoKernelZeroWindowHalfClose|TestGoListenPrecedence|TestGoListenTCP|TestGoListenUDPPort|TestGoMemoryControlPriority|TestGoMemoryDial|TestGoMemoryMTUUpdate|TestGoMemoryNoHandler|TestGoMemoryOutboundBound|TestGoMemoryOutboundReply|TestGoMemoryPathMTU|TestGoMemoryUDP|TestGoUDPReadBuffer|TestIPChangeMTU|TestIPChangeMetric|TestIsClosed|TestNetworkUpdateMonitorReceiveOverrun|TestPing|TestSetDNS

jobs:
  format:
    name: Check owned formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: release/GO_VERSION
          cache: false
      - name: Verify and compile shared CI tooling from the workflow revision
        run: |
          go test -mod=readonly ./cmd/internal/ci
          go build -mod=readonly -o "$RUNNER_TEMP/polaris-ci" ./cmd/internal/ci
      - name: Compile shared CI tooling for iOS validation on Intel macOS
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'desktop' }}
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -mod=readonly -o "$RUNNER_TEMP/polaris-ci-darwin-amd64" ./cmd/internal/ci
      - name: Share workflow tooling for exact historical source checkouts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: polaris-ci-tooling
          path: |
            ${{ runner.temp }}/polaris-ci
            ${{ runner.temp }}/polaris-ci-darwin-amd64
          if-no-files-found: error
          retention-days: 1
      - name: Checkout exact source for cheap formatting
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: .polaris-format-source
          persist-credentials: false
      - uses: ./.github/actions/pinned-formatter
      - name: Check owned remediation formatting before platform builds
        env:
          GOLANGCI_LINT: ${{ runner.temp }}/polaris-format-bin/golangci-lint
        working-directory: .polaris-format-source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          "$RUNNER_TEMP/polaris-ci" check-format
  linux:
    needs: format
    timeout-minutes: 90
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'mobile' }}
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null \
            -tags "$(cat release/DEFAULT_BUILD_TAGS),with_gvisor,with_purego" \
            -ldflags "$(cat release/LDFLAGS)" ./cmd/sing-box
  windows_build:
    needs: format
    timeout-minutes: 90
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'mobile' }}
    name: Windows amd64 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" \
            -ldflags "$(cat release/LDFLAGS)" ./cmd/sing-box
  windows_test:
    needs: format
    timeout-minutes: 90
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'mobile' }}
    name: Windows DNS regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Test
        timeout-minutes: 77
        run: |
          set -euo pipefail
          go test -count=20 -tags "$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" \
            -ldflags "$(cat release/LDFLAGS)" ./dns/transport/local/systemconfig/ | tee test.log
          grep -q '^ok' test.log
  macos:
    needs: format
    timeout-minutes: 90
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'mobile' }}
    name: macOS ${{ matrix.arch }}
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.arch }} /usr/bin/time -l go build -trimpath -o /dev/null \
            -tags "$(cat release/DEFAULT_BUILD_TAGS),with_gvisor" \
            -ldflags "$(cat release/LDFLAGS)" ./cmd/sing-box
  android:
    needs: format
    timeout-minutes: 120
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'desktop' }}
    name: Android libbox (${{ matrix.go_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_arch: [arm64, arm]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Setup Android NDK
        timeout-minutes: 25
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          printf '%s  %s\n' 753611f410d002cfcd3f3dc2ef49aad532089d3180b436c060a90bf0fcb64df2 "$RUNNER_TEMP/ndk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          make lib_install
          gopath=$(go env GOPATH)
          export PATH="$PATH:$gopath/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
      - name: Check symbols
        timeout-minutes: 5
        run: |
          unzip -q -o libbox.aar classes.jar
          javap -cp classes.jar io.nekohasekai.libbox.Libbox io.nekohasekai.libbox.CommandServer io.nekohasekai.libbox.PlatformInterface > symbols.txt
          test -s symbols.txt
          missing=0
          present=0
          for symbol in newTransientCommandServer newStrictCommandServer interfaceUpdateListenerIdentity checkConfigWithResult exportTailscaleStoreRetirement bindInterfaceControl; do
            if grep -q " $symbol(" symbols.txt; then
              present=$((present + 1))
              echo "present $symbol"
            else
              missing=$((missing + 1))
              echo "missing $symbol"
            fi
          done
          if [ "$EXPECTED_SYMBOLS" = mobile ]; then
            test "$missing" -eq 0
          else
            test "$present" -eq 0
          fi
      - name: Name fork diagnostic AAR
        timeout-minutes: 5
        env:
          GO_ARCH: ${{ matrix.go_arch }}
        run: |
          asset="polaris-box-${SOURCE_COMMIT}-android-${GO_ARCH}.aar"
          cp libbox.aar "$asset"
          echo "POLARIS_BOX_AAR=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 5
        with:
          name: polaris-box-selfcheck-android-${{ matrix.go_arch }}-${{ env.SOURCE_COMMIT }}
          path: ${{ env.POLARIS_BOX_AAR }}
          retention-days: 3
          compression-level: 0
  ios:
    needs: format
    timeout-minutes: 120
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'desktop' }}
    name: iOS libbox
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Native monitor lifecycle regressions
        timeout-minutes: 47
        run: |
          set -euo pipefail
          CGO_ENABLED=1 /usr/bin/time -l go test -parallel 2 -race -count=1 \
            -run '^(TestMonitor|TestConstructionScope)' \
            -tags "$(cat release/DEFAULT_BUILD_TAGS),with_purego" \
            -ldflags "$(cat release/LDFLAGS)" ./experimental/libbox/ ./adapter/
      - uses: actions/download-artifact@v5
        with:
          name: polaris-ci-tooling
          path: ${{ runner.temp }}/polaris-ci-tooling
      - name: Patch Go for iOS
        timeout-minutes: 5
        run: |
          chmod 700 "$RUNNER_TEMP/polaris-ci-tooling/polaris-ci-darwin-amd64"
          "$RUNNER_TEMP/polaris-ci-tooling/polaris-ci-darwin-amd64" patch-ios-go
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          /usr/bin/time -l make lib_install
          gopath=$(go env GOPATH)
          export PATH="$PATH:$gopath/bin"
          /usr/bin/time -l go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
      - name: Check symbols
        timeout-minutes: 5
        run: |
          find Libbox.xcframework -name '*.h' -exec cat {} + > symbols.txt
          test -s symbols.txt
          missing=0
          present=0
          for symbol in 'LibboxNewTransientCommandServer(' 'LibboxNewStrictCommandServer(' 'LibboxInterfaceUpdateListenerIdentity(' 'LibboxCheckConfigWithResult(' 'exportTailscaleStoreRetirement' 'bindInterfaceControl'; do
            if grep -qF "$symbol" symbols.txt; then
              present=$((present + 1))
              echo "present $symbol"
            else
              missing=$((missing + 1))
              echo "missing $symbol"
            fi
          done
          if [ "$EXPECTED_SYMBOLS" = mobile ]; then
            test "$missing" -eq 0
          else
            test "$present" -eq 0
          fi
  patch_tests:
    needs: format
    timeout-minutes: 90
    name: Patch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: polaris-ci-tooling
          path: ${{ runner.temp }}/polaris-ci-tooling
      - name: Enable the shared workflow tool
        run: chmod 700 "$RUNNER_TEMP/polaris-ci-tooling/polaris-ci"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        timeout-minutes: 5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Verify fixed source commit
        timeout-minutes: 5
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase 40-hex SHA' >&2; exit 1; }
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA source_commit=$actual"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
            third_party/tailscale/go.mod
            third_party/tailscale/go.sum
            third_party/wireguard-go/go.mod
            third_party/wireguard-go/go.sum
            third_party/tfo-go/go.mod
            third_party/tfo-go/go.sum
            third_party/sing-vmess/go.mod
            third_party/sing-vmess/go.sum
      - name: Compile resource adapter test sources with certificate features disabled
        timeout-minutes: 77
        run: |
          set -euo pipefail
          off_tags="$(tr ',' '\n' < release/DEFAULT_BUILD_TAGS | grep -v -E '^with_(tailscale|acme)$' | paste -sd, -),with_purego"
          case ",$off_tags," in *,with_tailscale,*|*,with_acme,*) exit 1;; esac
          printf 'feature-off-tags=%s\n' "$off_tags"
          packages=(. ./adapter/certificate ./common/httpclient ./common/runtimeclock ./option ./service/origin_ca)
          # Historical source checkouts keep their Box runtime tests in the root package.
          if [[ -d internal/boxruntime ]]; then
            packages+=(./internal/boxruntime)
          fi
          for package in "${packages[@]}"; do
            printf 'compile-test-source=%s\n' "$package"
            go test -c -o /dev/null -tags "$off_tags" -ldflags "$(cat release/LDFLAGS)" "$package"
          done
      - name: Test packages changed by the queue
        timeout-minutes: 77
        run: |
          set -euo pipefail
          cronet_library_dir() {
            local module=github.com/sagernet/cronet-go/lib/linux_amd64
            local directory
            go mod download "$module" || return
            directory="$(go list -m -f '{{.Dir}}' "$module")" || return
            test -r "$directory/libcronet.so" || return
            printf '%s\n' "$directory"
          }
          # Product tags share the upstream spelling; keep upstream baseline refs private.
          [[ "$BASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || exit 1
          [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags https://github.com/SagerNet/sing-box.git "refs/tags/$BASE_REF:refs/polaris/upstream-baseline"
          actual_baseline=$(git rev-parse --verify "refs/polaris/upstream-baseline^{commit}")
          test "$actual_baseline" = "$BASE_COMMIT"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          # Partition every changed Go/input path by its actual go.mod owner.
          # Unknown modules fail closed instead of silently losing coverage.
          selection_dir="$RUNNER_TEMP/polaris-ci/patch-test-packages"
          "$RUNNER_TEMP/polaris-ci-tooling/polaris-ci" patch-packages --base "$BASE_COMMIT" --output-directory "$selection_dir"
          mapfile -t packages < "$selection_dir/root-packages.txt"
          netns_selected=false
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "no root Go package changed since $BASE_REF"
          else
            printf '%s\n' "${packages[@]}"
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            # Resolve ./... before partitioning; go list failure must not lose packages.
            go list -tags "$tags" "${packages[@]}" > "$selection_dir/resolved-root-packages.txt"
            mapfile -t resolved_packages < "$selection_dir/resolved-root-packages.txt"
            test "${#resolved_packages[@]}" -gt 0
            ordinary_packages=()
            for package in "${resolved_packages[@]}"; do
              if [ "$package" = github.com/sagernet/sing-box/common/netns ]; then
                netns_selected=true
              else
                ordinary_packages+=("$package")
              fi
            done
            if [ "${#ordinary_packages[@]}" -gt 0 ]; then
              (
                if [[ ",$tags," == *,with_naive_outbound,* ]]; then
                  cronet_dir="$(cronet_library_dir)"
                  export LD_LIBRARY_PATH="$cronet_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                fi
                go test -race -count=1 -skip "^($INSTANCE_TESTS)\$" \
                  -tags "$tags" -ldflags "$(cat release/LDFLAGS)" \
                  "${ordinary_packages[@]}"
              ) | tee test.log
              grep -q '^ok' test.log
            fi
          fi
          if [ -f "$selection_dir/integration-tests-selected" ]; then
            grep -Fxq 'test' "$selection_dir/integration-tests-selected"
            grep -Fxq 'module test' test/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            ldflags="$(cat release/LDFLAGS)"
            source_dir="$PWD"
            (
              cd "$selection_dir"
              GOWORK=off go work init "$source_dir" "$source_dir/test"
              export GOWORK="$selection_dir/go.work"
              cd "$source_dir"
              # Resolve the test module's sibling replacement to the product's committed carrier.
              go work edit -replace "github.com/sagernet/sing-tun=$source_dir/third_party/sing-tun"
              go test -mod=readonly -race -count=1 -timeout=10m -v \
                -tags "$tags" -ldflags "$ldflags" \
                -run '^TestWireGuardEndpointDataPlane$/^system=false$' ./test |
                tee "$selection_dir/wireguard-integration-test.log"
              cronet_dir="$(cronet_library_dir)"
              LD_LIBRARY_PATH="$cronet_dir" go test -mod=readonly -race -count=1 -timeout=10m -v \
                -tags "$tags" -ldflags "$ldflags" -run '^TestNaiveSelf(ECH|InsecureConcurrency|QUIC(CongestionControl)?)?$' ./test |
                tee "$selection_dir/naive-integration-test.log"
            )
            grep -Eq '^[[:space:]]*--- PASS: TestWireGuardEndpointDataPlane/system=false ' "$selection_dir/wireguard-integration-test.log"
            grep -q '^--- PASS: TestNaiveSelfQUIC ' "$selection_dir/naive-integration-test.log"
            grep -q '^--- PASS: TestNaiveSelfQUICCongestionControl ' "$selection_dir/naive-integration-test.log"
            printf '%s\n' 'WireGuard integration: userspace raced; kernel TUN variant compiled.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$selection_dir/sing-tun-selected" ]; then
            grep -qx 'module github.com/sagernet/sing-tun' third_party/sing-tun/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            (cd third_party/sing-tun && go test -race -count=1 \
              -skip "^($SING_TUN_INSTANCE_TESTS)\$" -tags "$tags" ./...) | tee sing-tun-test.log
            grep -q '^ok' sing-tun-test.log
            # Retain unprivileged ping coverage without running its raw-socket cases.
            (cd third_party/sing-tun && go test -race -count=1 -v -tags "$tags" \
              -run '^TestPing$/^(ipv4|ipv6)$/^unprivileged$' ./ping) | tee sing-tun-unprivileged-ping.log
            grep -q '^ok' sing-tun-unprivileged-ping.log
          fi
          if [ -f "$selection_dir/metacubex-utls-selected" ]; then
            grep -qx 'module github.com/metacubex/utls' third_party/metacubex-utls/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            (cd third_party/metacubex-utls && go test -race -count=1 -tags "$tags" ./...) | tee metacubex-utls-test.log
            grep -q '^ok' metacubex-utls-test.log
          fi
          if [ -f "$selection_dir/cronet-go-selected" ]; then
            grep -qx 'module github.com/sagernet/cronet-go' third_party/cronet-go/go.mod
            # Fake-native lifetime barriers only; no library loading or native traffic.
            (cd third_party/cronet-go && go test -race -count=1 -v -tags with_purego ./...) | tee cronet-go-test.log
            grep -q '^--- PASS: TestNaiveAdmissionSealsBeforeJoin ' cronet-go-test.log
            grep -q '^--- PASS: TestNaiveDialCreationBarrierAndTerminalOwnership ' cronet-go-test.log
          fi
          if [ -f "$selection_dir/fswatch-selected" ]; then
            grep -qx 'module github.com/sagernet/fswatch' third_party/fswatch/go.mod
            (cd third_party/fswatch && go test -race -count=1 -v ./...) | tee fswatch-test.log
            grep -q '^--- PASS: TestFailedAddClosesUnpublishedWatcher ' fswatch-test.log
            grep -q '^--- PASS: TestSuccessfulAddTransfersWithoutClosing ' fswatch-test.log
            grep -q '^--- PASS: TestFailedAddPreservesCleanupFailure ' fswatch-test.log
          fi
          if [ -f "$selection_dir/sing-selected" ]; then
            grep -qx 'module github.com/sagernet/sing' third_party/sing/go.mod
            (cd third_party/sing && go test -race -count=1 -v ./...) | tee sing-test.log
            grep -q '^--- PASS: TestRuntimePacketContextRetainsBeforeLaunchAndJoinsTerminalTail ' sing-test.log
            grep -q '^--- PASS: TestRuntimePacketContextFailureDoesNotPublishSession ' sing-test.log
          fi
          if [ -f "$selection_dir/sing-quic-selected" ]; then
            grep -qx 'module github.com/sagernet/sing-quic' third_party/sing-quic/go.mod
            (cd third_party/sing-quic && go test -race -count=1 -v ./...) | tee sing-quic-test.log
            grep -q '^--- PASS: TestServerRuntimeLegacyContextIsUnchanged ' sing-quic-test.log
            grep -q '^--- PASS: TestServerRuntimeRejectsBeforeTaskLaunch ' sing-quic-test.log
            grep -q '^--- PASS: TestServerRuntimeSuppliesOwnedTaskContext ' sing-quic-test.log
            grep -q '^--- PASS: TestRejectedRuntimePacketSessionClosesAndRemovesExactEntry ' sing-quic-test.log
          fi
          if [ -f "$selection_dir/tailscale-selected" ]; then
            grep -qx 'github.com/sagernet/tailscale' "$selection_dir/tailscale-selected"
            grep -qx 'module github.com/sagernet/tailscale' third_party/tailscale/go.mod
            # Resolve from the product root: the SDK must use the exact verified
            # local carrier and the product's selected dependency replacements.
            go list -mod=readonly -m -json github.com/sagernet/tailscale > "$selection_dir/tailscale-module.json"
            "$RUNNER_TEMP/polaris-ci-tooling/polaris-ci" check-sdk-selection "$selection_dir"
            mapfile -t tailscale_packages < "$selection_dir/tailscale-packages.txt"
            test "${#tailscale_packages[@]}" -gt 0
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            go test -mod=readonly -race -count=1 -timeout=10m -v \
              -tags "$tags" -ldflags "$(cat release/LDFLAGS)" \
              "${tailscale_packages[@]}" | tee "$selection_dir/tailscale-test.log"
            grep -q '^--- PASS: TestSealRequiresActualRelease ' "$selection_dir/tailscale-test.log"
            grep -q '^--- PASS: TestClosedQueueWaitIsNotJoin ' "$selection_dir/tailscale-test.log"
            grep -q '^--- PASS: TestRuntimeInterfaceHooksAreMonitorLocal ' "$selection_dir/tailscale-test.log"
            grep -q '^--- PASS: TestRuntimeInterfaceHookErrorsDoNotFallback ' "$selection_dir/tailscale-test.log"
            grep -q '^--- PASS: TestRuntimeCGNATUsesOnlyOwnerInterfaces ' "$selection_dir/tailscale-test.log"
          fi
          if [ -f "$selection_dir/wireguard-go-selected" ]; then
            grep -qx 'github.com/sagernet/wireguard-go' "$selection_dir/wireguard-go-selected"
            grep -qx 'module github.com/sagernet/wireguard-go' third_party/wireguard-go/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            ldflags="$(cat release/LDFLAGS)"
            (cd third_party/wireguard-go && go test -race -count=1 -timeout=10m -v \
              -tags "$tags" -ldflags "$ldflags" ./...) | tee "$selection_dir/wireguard-go-test.log"
            grep -q '^--- PASS: TestRuntimeTimerDelSyncJoinsOriginalCallback ' "$selection_dir/wireguard-go-test.log"
            grep -q '^--- PASS: TestRuntimeWorkerAdmissionClosesBeforeWait ' "$selection_dir/wireguard-go-test.log"
            grep -q '^--- PASS: TestRuntimeFinalJoinHoldsNoStateOrNetLocks ' "$selection_dir/wireguard-go-test.log"
            grep -q '^--- PASS: TestRuntimeSourceGenerationInvalidatesBeforeSend ' "$selection_dir/wireguard-go-test.log"
            grep -q '^--- PASS: TestRuntimeRouteCancellationWithContinuouslyReadyInput ' "$selection_dir/wireguard-go-test.log"
            grep -q '^--- PASS: TestRuntimeCloseJoinsOriginalCollector ' "$selection_dir/wireguard-go-test.log"
          fi
          if [ -f "$selection_dir/tfo-go-selected" ]; then
            grep -qx 'github.com/database64128/tfo-go/v2' "$selection_dir/tfo-go-selected"
            grep -qx 'module github.com/database64128/tfo-go/v2' third_party/tfo-go/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            ldflags="$(cat release/LDFLAGS)"
            (cd third_party/tfo-go && go test -race -count=1 -timeout=10m -v \
              -tags "$tags" -ldflags "$ldflags" ./...) | tee "$selection_dir/tfo-go-test.log"
            grep -q '^--- PASS: TestRuntimeWriteCancellationJoinsActualDeadlineMutation ' "$selection_dir/tfo-go-test.log"
            grep -q '^--- PASS: TestRuntimeWriteWithoutCancellationDoesNotWaitForCallback ' "$selection_dir/tfo-go-test.log"
          fi
          if [ -f "$selection_dir/go-nat-selected" ]; then
            grep -Fqx 'github.com/libp2p/go-nat' "$selection_dir/go-nat-selected"
            grep -Fqx 'module github.com/libp2p/go-nat' third_party/go-nat/go.mod
            grep -Fqx 'replace github.com/libp2p/go-nat => ./third_party/go-nat' go.mod
            # Use the product root so the owned NAT implementation and its
            # transitive dependencies are selected by the verified replacements.
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            ldflags="$(cat release/LDFLAGS)"
            go test -mod=readonly -race -gcflags=all=-d=checkptr=2 -count=1 -timeout=10m -v \
              -tags "$tags" -ldflags "$ldflags" github.com/libp2p/go-nat/... | tee "$selection_dir/go-nat-test.log"
            grep -q '^--- PASS: TestDiscoverNATsCancellationJoinsAllFourLateProducers ' "$selection_dir/go-nat-test.log"
            grep -q '^--- PASS: TestNATPMPDeleteRequiresExactAckAndKeepsDebtForRetry ' "$selection_dir/go-nat-test.log"
            grep -q '^--- PASS: TestUPNPDeleteAlwaysVerifiesCurrentIdentityAndHonorsConfirmedAbsence ' "$selection_dir/go-nat-test.log"
            grep -q '^--- PASS: TestUPNPCapturedDiscoveryJoinsEverySSDPRequestBeforeCancellation ' "$selection_dir/go-nat-test.log"
            grep -q '^--- PASS: TestNATCallerHTTPEntryRejectsImplicitDefaultAndCanceledWork ' "$selection_dir/go-nat-test.log"
          fi
          if [ -f "$selection_dir/google-nftables-selected" ]; then
            grep -Fqx 'github.com/google/nftables' "$selection_dir/google-nftables-selected"
            grep -Fqx 'module github.com/google/nftables' third_party/google-nftables/go.mod
            grep -Fqx 'replace github.com/google/nftables => ./third_party/google-nftables' go.mod
            # Keep the product dependency graph; live-kernel tests retain their upstream opt-in.
            go test -mod=readonly -race -count=1 -timeout=10m github.com/google/nftables/...
            GOARCH=386 CGO_ENABLED=0 go test -mod=readonly -count=1 -timeout=10m github.com/google/nftables/...
          fi
          if [ -f "$selection_dir/sing-vmess-selected" ]; then
            grep -qx 'github.com/sagernet/sing-vmess' "$selection_dir/sing-vmess-selected"
            grep -qx 'module github.com/sagernet/sing-vmess' third_party/sing-vmess/go.mod
            # Run the complete nested module from the product root. Bare cd
            # would silently select older TLS/sing dependencies and lose the
            # exact runtime ownership replacements under test.
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            go test -mod=readonly -race -gcflags=all=-d=checkptr=2 -count=1 -timeout=10m -v \
              -tags "$tags" github.com/sagernet/sing-vmess/... | tee "$selection_dir/sing-vmess-test.log"
            grep -q '^--- PASS: TestVisionTLSProvidersActualHandshakeAndDirect ' "$selection_dir/sing-vmess-test.log"
            grep -q '^--- PASS: TestVisionTLSProvidersRejectBadCertificate ' "$selection_dir/sing-vmess-test.log"
            grep -q '^--- PASS: TestVisionTLSBufferLayoutRejectsUnknownShapes ' "$selection_dir/sing-vmess-test.log"
          fi
          if [ "$netns_selected" = true ]; then
            # CI compiles the original raced test; native validation belongs to development machines.
            binary_dir="$(mktemp -d "$RUNNER_TEMP/netns-patch-test.XXXXXX")"
            trap 'rm -rf "$binary_dir"' EXIT
            go test -race -count=1 -v -c -skip "^($INSTANCE_TESTS)\$" \
              -tags "$tags" -ldflags "$(cat release/LDFLAGS)" \
              -o "$binary_dir/netns.test" github.com/sagernet/sing-box/common/netns
            test -s "$binary_dir/netns.test"
            test -x "$binary_dir/netns.test"
            test ! -L "$binary_dir/netns.test"
            printf '%s\n' 'netns: raced compilation only; native validation runs on development machines.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test instances in process
        timeout-minutes: 77
        if: ${{ inputs.run_instance_tests }}
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run "^($INSTANCE_TESTS)\$" \
            -tags "$(cat release/DEFAULT_BUILD_TAGS),with_purego" \
            -ldflags "$(cat release/LDFLAGS)" ./experimental/libbox/ ./daemon/ | tee instance.log
          grep -q '^--- PASS' instance.log
          if [ -f third_party/sing-tun/go.mod ]; then
            grep -qx 'module github.com/sagernet/sing-tun' third_party/sing-tun/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            # This explicit opt-in supplies neither sudo nor device permissions.
            # Its real network operations require a separately authorized runner.
            (cd third_party/sing-tun && go test -race -count=1 -v \
              -run "^($SING_TUN_INSTANCE_TESTS)\$" -tags "$tags" ./...) | tee sing-tun-instance.log
            grep -q '^--- PASS' sing-tun-instance.log
          fi

