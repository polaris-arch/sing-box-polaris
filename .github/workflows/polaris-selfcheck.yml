            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Test packages changed by the queue
        timeout-minutes: 77
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/polaris-command-selfcheck-patch-tests-0.sh" <<'POLARIS_COMMAND'
          # Product tags share the upstream spelling; keep upstream baseline refs private.
          [[ "$BASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || exit 1
          [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags https://github.com/SagerNet/sing-box.git "refs/tags/$BASE_REF:refs/polaris/upstream-baseline"
          actual_baseline=$(git rev-parse --verify "refs/polaris/upstream-baseline^{commit}")
          test "$actual_baseline" = "$BASE_COMMIT"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          # The tracked sing-tun replacement is an independent Go module.
          # Keep it out of root package arguments and test its native packages
          # from its own module root; ./... respects OS build constraints.
          packages=$(git diff --name-only "$BASE_COMMIT..HEAD" -- '*.go' ':!third_party/sing-tun/**' | xargs -r -n1 dirname | sort -u | sed 's#^#./#')
          if [ -z "$packages" ]; then
            echo "no root Go package changed since $BASE_REF"
          else
            echo "$packages"
            # shellcheck disable=SC2086
            go test -race -count=1 -skip "^($INSTANCE_TESTS)\$" \
              -tags "$(cat release/DEFAULT_BUILD_TAGS),with_purego" \
              -ldflags "$(cat release/LDFLAGS)" $packages | tee test.log
            grep -q '^ok' test.log
          fi
          nested=$(git diff --name-only "$BASE_COMMIT..HEAD" -- 'third_party/sing-tun/*.go')
          if [ -n "$nested" ]; then
            grep -qx 'module github.com/sagernet/sing-tun' third_party/sing-tun/go.mod
            tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
            (cd third_party/sing-tun && go test -race -count=1 \
              -skip "^($SING_TUN_INSTANCE_TESTS)\$" -tags "$tags" ./...) | tee sing-tun-test.log
            grep -q '^ok' sing-tun-test.log
            # Retain unprivileged ping coverage without running its raw-socket cases.
            (cd third_party/sing-tun && go test -race -count=1 -v -tags "$tags" \
              -run '^TestPing$/^(ipv4|ipv6)$/^unprivileged$' ./ping) | tee sing-tun-unprivileged-ping.log
            grep -q '^ok' sing-tun-unprivileged-ping.log
          fi
          POLARIS_COMMAND
          python -B "$RUNNER_TEMP/polaris-ci-observe.py" --phase selfcheck-patch-tests-0 \
            --output "$RUNNER_TEMP/polaris-ci/selfcheck-patch-tests-0" --timeout-seconds 4500 \
            -- "$POLARIS_RUNNER_BASH" --noprofile --norc -e -o pipefail "$RUNNER_TEMP/polaris-command-selfcheck-patch-tests-0.sh"
      - name: Test instances in process
