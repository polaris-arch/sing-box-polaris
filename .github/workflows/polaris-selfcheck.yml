            # Its real network operations require a separately authorized runner.
            (cd third_party/sing-tun && go test -race -count=1 -v \
              -run "^($SING_TUN_INSTANCE_TESTS)\$" -tags "$tags" ./...) | tee sing-tun-instance.log
            grep -q '^--- PASS' sing-tun-instance.log
