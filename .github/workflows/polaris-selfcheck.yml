          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$GITHUB_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          fi
          git show "$GITHUB_SHA:scripts/polaris_runner_resources.py" > "$RUNNER_TEMP/polaris-runner-resources.py"
          git show "$GITHUB_SHA:scripts/polaris_ci_observe.py" > "$RUNNER_TEMP/polaris-ci-observe.py"
          git show "$GITHUB_SHA:scripts/polaris_ci_downloads.py" > "$RUNNER_TEMP/polaris-ci-downloads.py"
          python -B "$RUNNER_TEMP/polaris-runner-resources.py" \
            --kind selfcheck --scratch "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/polaris-runner-budget.json" --github-env "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/sing-tun/go.mod
            third_party/sing-tun/go.sum
      - name: Build
        timeout-minutes: 77
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/polaris-command-selfcheck-windows-build-0.sh" <<'POLARIS_COMMAND'
          GOMAXPROCS="$POLARIS_COMPILE_GOMAXPROCS" CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null \
            -tags "$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" \
            -ldflags "$(cat release/LDFLAGS)" ./cmd/sing-box

          POLARIS_COMMAND
          python -B "$RUNNER_TEMP/polaris-ci-observe.py" --phase selfcheck-windows-build-0 \
            --output "$RUNNER_TEMP/polaris-ci/selfcheck-windows-build-0" --timeout-seconds 4500 \
            -- "$POLARIS_RUNNER_BASH" --noprofile --norc -e -o pipefail "$RUNNER_TEMP/polaris-command-selfcheck-windows-build-0.sh"
      - name: Preserve command, failure and resource observations
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-ci-windows_build-host-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/polaris-ci
            ${{ runner.temp }}/polaris-ci-job-budget.json
            ${{ runner.temp }}/polaris-runner-budget.json
          if-no-files-found: warn
          retention-days: 14
  windows_test:
    needs: classify
    timeout-minutes: 90
    if: ${{ needs.classify.outputs.run_full == 'true' && ((github.event_name != 'workflow_dispatch' || !inputs.patch_only) && inputs.source_role != 'mobile') }}
    name: Windows DNS regression
    runs-on: windows-latest
    steps:
