                before[path]=f.read_bytes()
                if hashlib.sha256(before[path]).hexdigest()!=digest:raise SystemExit('Final owner manifest/source mismatch '+path)
            if not before:raise SystemExit('Empty owned scope')
            if repo=='app':
                # Standard stdin Input::Text formats exactly supplied source, not a module tree.
                for path,data in before.items():
                    (cwd/path).write_bytes(cmd(['rustfmt','--edition','2021','--emit','stdout'],cwd,input=data))
            else:
                subprocess.run([os.environ['GOLANGCI_LINT'],'fmt','--config','.golangci.yml',*sorted(before)],cwd=cwd,check=True)
            changed=[p for p in cmd(['git','diff','--name-only','-z','HEAD'],cwd).decode().split('\0') if p]
            if not set(changed)<=set(before):raise SystemExit('Formatter escaped owned scope')
            for path in sorted(before):
                evidence['files'].append({'repository':repo,'path':path,'changed':path in changed,'beforeSHA256':hashlib.sha256(before[path]).hexdigest(),'afterSHA256':hashlib.sha256((cwd/path).read_bytes()).hexdigest()})
            (out/(repo+'.patch')).write_bytes(cmd(['git','diff','--binary','--full-index','HEAD'],cwd))
        (out/'evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
        # Check parity without expanding the write scope or compiling/testing the product.
        subprocess.run(['cargo','fmt','--all','--','--check'],cwd='app',check=True)
    - name: Preserve implementation delta (not test evidence)
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: dots-format-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/polaris-format-delta
        if-no-files-found: error
        retention-days: 14
