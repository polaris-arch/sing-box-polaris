name: CI contract static checks
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref_type == 'branch' && format('tip-{0}', github.ref) || format('audit-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: release/GO_VERSION
        cache: false
    - run: go test -mod=readonly ./cmd/internal/ci ./common/badversion
    - uses: ./.github/actions/pinned-formatter
    - name: Check pinned owned-source formatting without product compilation
      env:
        GOLANGCI_LINT: ${{ runner.temp }}/polaris-format-bin/golangci-lint
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        go run -mod=readonly ./cmd/internal/ci check-format
'on':
  push:
    branches:
    - polaris-main
  pull_request:
    branches:
    - polaris-main
    paths:
    - .github/workflows/**
    - .github/actions/pinned-formatter/action.yml
    - .github/go-toolchains.json
    - .github/patches/**
    - scripts/ci/**
    - cmd/internal/ci/**
    - release/ci/**
  workflow_dispatch: null
