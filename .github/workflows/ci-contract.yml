name: CI contract static checks
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref_type == 'branch' && format('tip-{0}', github.ref) || format('audit-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
    - run: python -m unittest discover -s scripts/ci -p 'test_ci_contract.py'
    - name: Require cold zero-fuzz Go patch controls
      shell: bash
      run: |
        set -euo pipefail
        command -v patch
        python -B -m unittest discover -s scripts/ci -p 'test_go_toolchain.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_container_source_identity.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_native_release_index.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_github_release.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_release_identity.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_polaris_version.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_client_branding.py'
    - run: python -B -m unittest discover -s scripts/ci -p 'test_apple_package_overlays.py'
    - run: python -B -m unittest discover -s scripts/ci -p 'test_client_source.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_android_material_reuse.py'
    - run: python -m unittest discover -s scripts/ci -p 'test_owned_publication_gate.py'
    - run: python -B -m unittest discover -s scripts -p 'test_polaris_ci_impact.py'
    - run: python -B -m unittest discover -s scripts -p 'test_polaris_runner_resources.py'
    - run: PYTHONPATH=scripts python -B -m unittest test_polaris_production_release.ProductionTests.test_historical_workflow_is_manual_no_publishing_and_does_not_retarget_lanes
'on':
  push:
    branches:
    - polaris-main
    paths:
    - .github/workflows/**
    - .github/go-toolchains.json
    - .github/patches/**
    - scripts/ci/**
    - scripts/polaris_ci_impact.py
    - scripts/test_polaris_ci_impact.py
    - scripts/test_polaris_runner_resources.py
    - scripts/test_polaris_production_release.py
    - scripts/testdata/historical-workflows/**
    - release/ci/**
  pull_request:
    branches:
    - polaris-main
    paths:
    - .github/workflows/**
    - .github/go-toolchains.json
    - .github/patches/**
    - scripts/ci/**
    - scripts/polaris_ci_impact.py
    - scripts/test_polaris_ci_impact.py
    - scripts/test_polaris_runner_resources.py
    - scripts/test_polaris_production_release.py
    - scripts/testdata/historical-workflows/**
    - release/ci/**
  workflow_dispatch: null
