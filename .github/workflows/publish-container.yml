name: Explicit owned container publication
env:
  REGISTRY_IMAGE: ghcr.io/polaris-arch/sing-box-polaris
jobs:
  build_binary:
    name: Build binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
        - arch: amd64
          naive: true
          docker_platform: linux/amd64
        - arch: arm64
          naive: true
          docker_platform: linux/arm64
        - arch: '386'
          naive: true
          docker_platform: linux/386
        - arch: arm
          goarm: '7'
          naive: true
          docker_platform: linux/arm/v7
        - arch: mipsle
          gomips: softfloat
          naive: true
          docker_platform: linux/mipsle
        - arch: riscv64
          naive: true
          docker_platform: linux/riscv64
        - arch: loong64
          naive: true
          docker_platform: linux/loong64
        - arch: arm
          goarm: '6'
          docker_platform: linux/arm/v6
        - arch: ppc64le
          docker_platform: linux/ppc64le
        - arch: s390x
          docker_platform: linux/s390x
    steps:
    - name: Get commit to build
      id: ref
      run: |
        [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
        printf "ref=%s\n" "$SOURCE_TAG" >> "$GITHUB_OUTPUT"
      env:
        SOURCE_TAG: ${{ inputs.tag }}
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ steps.ref.outputs.ref }}
        fetch-depth: 0
    - name: Verify reviewed owned distribution and exact source tag
      run: |
        python3 scripts/ci/owned_distribution.py verify-tag
        python3 scripts/ci/owned_distribution.py verify-registry
      env:
        VERSION: ${{ inputs.tag }}
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.8
    - name: Clone cronet-go
      if: matrix.naive
      run: |
        set -xeuo pipefail
        CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
        git init ~/cronet-go
        git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
        git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
        git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C ~/cronet-go checkout FETCH_HEAD
        git -C ~/cronet-go submodule update --init --recursive --depth=1
    - name: Regenerate Debian keyring
      if: matrix.naive
      run: |
        set -xeuo pipefail
        rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
        cd ~/cronet-go
        GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
    - name: Cache Chromium toolchain
      if: matrix.naive
      id: cache-chromium-toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/cronet-go/naiveproxy/src/third_party/llvm-build/
          ~/cronet-go/naiveproxy/src/gn/out/
          ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
          ~/cronet-go/naiveproxy/src/out/sysroot-build/
        key: chromium-toolchain-${{ matrix.arch }}-musl-${{ hashFiles('.github/CRONET_GO_VERSION') }}
    - name: Download Chromium toolchain
      if: matrix.naive
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
    - name: Set version
      run: |
        set -euo pipefail
        VERSION=$(python3 scripts/ci/polaris_version.py "${CANDIDATE_TAG#v}")
        [ "$(git rev-parse "refs/tags/$CANDIDATE_TAG^{commit}")" = "$(git rev-parse HEAD)" ]
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      env:
        CANDIDATE_TAG: ${{ inputs.tag }}
    - name: Set Chromium toolchain environment
      if: matrix.naive
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV
    - name: Set build tags
      run: |
        set -xeuo pipefail
        if [[ "${{ matrix.naive }}" == "true" ]]; then
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_musl"
        else
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
        fi
        echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
    - name: Set shared ldflags
      run: |
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
    - name: Build (naive)
      if: matrix.naive
      run: |
        set -xeuo pipefail
        go build -v -trimpath -o sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
    - name: Build (non-naive)
      if: ${{ ! matrix.naive }}
      run: |
        set -xeuo pipefail
        go build -v -trimpath -o sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GOARM: ${{ matrix.goarm }}
    - name: Prepare artifact
      run: |
        platform=${{ matrix.docker_platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
        # Rename binary to include arch info for Dockerfile.binary
        BINARY_NAME="sing-box-${{ matrix.arch }}"
        if [[ -n "${{ matrix.goarm }}" ]]; then
          BINARY_NAME="${BINARY_NAME}v${{ matrix.goarm }}"
        fi
        mv sing-box "${BINARY_NAME}"
        echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ env.PLATFORM_PAIR }}
        path: ${{ env.BINARY_NAME }}
        if-no-files-found: error
        retention-days: 1
    environment: polaris-distribution
    if: github.repository == 'polaris-arch/sing-box-polaris' && vars.POLARIS_DISTRIBUTION_ENABLED == 'true' && inputs.publish_registry
  build_docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
    - build_binary
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: linux/amd64
        - platform: linux/arm/v6
        - platform: linux/arm/v7
        - platform: linux/arm64
        - platform: linux/386
        - platform: linux/ppc64le
        - platform: linux/riscv64
        - platform: linux/s390x
        - platform: linux/loong64
          base_image: ghcr.io/loong64/alpine:edge
    steps:
    - name: Get commit to build
      id: ref
      run: |
        [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
        printf "ref=%s\n" "$SOURCE_TAG" >> "$GITHUB_OUTPUT"
      env:
        SOURCE_TAG: ${{ inputs.tag }}
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ steps.ref.outputs.ref }}
        fetch-depth: 0
    - name: Verify reviewed owned distribution and exact source tag
      run: |
        python3 scripts/ci/owned_distribution.py verify-tag
        python3 scripts/ci/owned_distribution.py verify-registry
      env:
        VERSION: ${{ inputs.tag }}
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
    - name: Download binary
      uses: actions/download-artifact@v5
      with:
        name: binary-${{ env.PLATFORM_PAIR }}
        path: .
    - name: Prepare binary
      run: |
        # Find and make the binary executable
        chmod +x sing-box-*
        ls -la sing-box-*
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_IMAGE }}
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        platforms: ${{ matrix.platform }}
        context: .
        file: Dockerfile.binary
        build-args: |
          BASE_IMAGE=${{ matrix.base_image || 'alpine' }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
    environment: polaris-distribution
    if: github.repository == 'polaris-arch/sing-box-polaris' && vars.POLARIS_DISTRIBUTION_ENABLED == 'true' && inputs.publish_registry
    permissions:
      contents: read
      packages: write
  merge:
    if: github.repository == 'polaris-arch/sing-box-polaris' && vars.POLARIS_DISTRIBUTION_ENABLED == 'true' && inputs.publish_registry
    runs-on: ubuntu-latest
    needs:
    - build_docker
    steps:
    - name: Get commit to build
      id: ref
      run: |
        [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
        printf "ref=%s\n" "$SOURCE_TAG" >> "$GITHUB_OUTPUT"
      env:
        SOURCE_TAG: ${{ inputs.tag }}
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ steps.ref.outputs.ref }}
        fetch-depth: 0
    - name: Verify reviewed owned distribution and exact source tag
      run: |
        python3 scripts/ci/owned_distribution.py verify-tag
        python3 scripts/ci/owned_distribution.py verify-registry
      env:
        VERSION: ${{ inputs.tag }}
    - name: Detect track
      run: printf "TRACK=polaris\nNAME=sing-box-polaris\nDOCKER_TAG=polaris-latest\n" >> "$GITHUB_ENV"
    - name: Download digests
      uses: actions/download-artifact@v5
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Refuse existing immutable container version
      env:
        VERSION_TAG: ${{ steps.ref.outputs.ref }}
      run: |
        set -euo pipefail
        if docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION_TAG" > "$RUNNER_TEMP/registry-check" 2>&1; then
          echo "Container version already exists; overwrite forbidden" >&2; exit 1
        fi
        if ! grep -Eqi "manifest unknown|not found" "$RUNNER_TEMP/registry-check"; then
          cat "$RUNNER_TEMP/registry-check" >&2; exit 1
        fi
    - name: Create manifest list and push
      if: github.event_name != 'push'
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create -t "${{ env.REGISTRY_IMAGE }}:${{ steps.ref.outputs.ref }}" $(printf "${{ env.REGISTRY_IMAGE }}@sha256:%s " *)
    - name: Inspect image
      if: github.event_name != 'push'
      run: |
        docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.ref.outputs.ref }}"
    environment: polaris-distribution
    permissions:
      contents: read
      packages: write
'on':
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Existing reviewed source tag
        default: v1.15.0-polaris-alpha.12
      publish_registry:
        type: boolean
        default: false
        description: Publish full upstream image matrix to owned Polaris GHCR
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-container-${{ inputs.tag }}
  cancel-in-progress: false
