name: Linux repository packages (unsigned candidate)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-audit-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      material_required: ${{ steps.material_scope.outputs.required }}
      version: ${{ steps.outputs.outputs.version }}
      tag_object: ${{ steps.source.outputs.tag_object }}
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Go
      if: github.event_name != 'workflow_dispatch'
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
    - name: Check input version
      if: github.event_name == 'workflow_dispatch'
      run: |
        python3 scripts/ci/polaris_version.py "$CANDIDATE_VERSION"
        printf "version=%s\n" "$CANDIDATE_VERSION" >> "$GITHUB_ENV"
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
    - name: Calculate version
      if: github.event_name != 'workflow_dispatch'
      run: go run -v ./cmd/internal/read_tag --ci --nightly
    - name: Set outputs
      id: outputs
      run: echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Bind unsigned candidate source, annotated tag and testing-track policy
      id: source
      run: python3 scripts/ci/linux_candidate_track.py
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
    - name: Classify Debian material requirement
      id: material_scope
      env:
        REQUIRED: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        CHECKPOINT_ARTIFACT_ID: ${{ inputs.debian_checkpoint_artifact_id }}
        CHECKPOINT_DIGEST: ${{ inputs.debian_checkpoint_digest }}
        MATERIALS_ONLY: 'false'
        SOURCE_GENERATE_ONLY: 'false'
        WINDOWS_NATIVE_PROOF: 'false'
      shell: bash
      run: |
        if [[ "$REQUIRED" != "true" && "$REQUIRED" != "false" ]]; then
          echo "invalid Debian material mode" >&2
          exit 1
        fi
        if [[ "$MATERIALS_ONLY" != "true" && "$MATERIALS_ONLY" != "false" ]]; then
          echo "invalid Materials-only selector" >&2
          exit 1
        fi
        if [[ "$MATERIALS_ONLY" == "true" && ( "$REQUIRED" != "true" || "$SOURCE_GENERATE_ONLY" != "false" || "$WINDOWS_NATIVE_PROOF" != "false" ) ]]; then
          echo "Materials requires exact-tag final identity and excludes source generation/native proof" >&2
          exit 1
        fi
        if [[ -n "$CHECKPOINT_ARTIFACT_ID" && -z "$CHECKPOINT_DIGEST" || -z "$CHECKPOINT_ARTIFACT_ID" && -n "$CHECKPOINT_DIGEST" ]]; then
          echo "Debian candidate requires both artifact ID and digest" >&2
          exit 1
        fi
        if [[ -n "$CHECKPOINT_ARTIFACT_ID" && ( ! "$CHECKPOINT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$CHECKPOINT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ) ]]; then
          echo "invalid exact candidate ID/digest" >&2
          exit 1
        fi
        if [[ "$REQUIRED" != "true" && ( -n "$CHECKPOINT_ARTIFACT_ID" || -n "$CHECKPOINT_DIGEST" ) ]]; then
          echo "Debian candidate is only allowed for Materials or required Final" >&2
          exit 1
        fi
        if [[ "$REQUIRED" == "true" && "$MATERIALS_ONLY" != "true" && -z "$CHECKPOINT_ARTIFACT_ID" ]]; then
          echo "Final NOT_READY: an explicit completed Materials candidate is required" >&2
          exit 1
        fi
        printf 'required=%s\n' "$REQUIRED" >> "$GITHUB_OUTPUT"
  debian_materials:
    name: Supply verified Debian raw inputs
    if: ${{ needs.calculate_version.outputs.material_required == 'true' }}
    needs: [calculate_version]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      raw_id: ${{ steps.materials.outputs.raw_id }}
      raw_digest: ${{ steps.materials.outputs.raw_digest }}
      ready_id: ${{ steps.materials.outputs.ready_id }}
      ready_digest: ${{ steps.materials.outputs.ready_digest }}
    steps:
    - name: Checkout exact supplier source
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Supply exact Debian profile union
      id: materials
      uses: ./.github/actions/prepare-debian-materials
      with:
        checkpoint-artifact-id: ${{ inputs.debian_checkpoint_artifact_id }}
        checkpoint-artifact-digest: ${{ inputs.debian_checkpoint_digest }}
        role: linux
        tag: v${{ inputs.version }}
        tag-object: ${{ needs.calculate_version.outputs.tag_object }}
      env:
        GH_TOKEN: ${{ github.token }}
  build:
    name: Build binary
    if: ${{ !cancelled() && needs.calculate_version.result == 'success' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs:
    - calculate_version
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: linux
          arch: amd64
          naive: true
          debian: amd64
          rpm: x86_64
          pacman: x86_64
        - os: linux
          arch: arm64
          naive: true
          debian: arm64
          rpm: aarch64
          pacman: aarch64
        - os: linux
          arch: '386'
          naive: true
          debian: i386
          rpm: i386
        - os: linux
          arch: arm
          goarm: '7'
          naive: true
          debian: armhf
          rpm: armv7hl
          pacman: armv7hl
        - os: linux
          arch: mipsle
          gomips: softfloat
          naive: true
          debian: mipsel
          rpm: mipsel
        - os: linux
          arch: riscv64
          naive: true
          debian: riscv64
          rpm: riscv64
        - os: linux
          arch: loong64
          naive: true
          debian: loongarch64
          rpm: loongarch64
        - os: linux
          arch: arm
          goarm: '6'
          debian: armel
          rpm: armv6hl
        - os: linux
          arch: mips64le
          debian: mips64el
          rpm: mips64el
        - os: linux
          arch: s390x
          debian: s390x
          rpm: s390x
        - os: linux
          arch: ppc64le
          debian: ppc64el
          rpm: ppc64le
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify unsigned candidate source, annotated tag and testing-track policy
      run: python3 scripts/ci/linux_candidate_track.py
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
        EXPECTED_TAG_OBJECT: ${{ needs.calculate_version.outputs.tag_object }}
        GH_TOKEN: ${{ github.token }}
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
    - name: Clone cronet-go
      if: matrix.naive
      timeout-minutes: 10
      run: |
        set -xeuo pipefail
        CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
        git init ~/cronet-go
        git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
        git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
        git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C ~/cronet-go checkout FETCH_HEAD
        git -C ~/cronet-go submodule update --init --recursive --depth=1
        python3 "$GITHUB_WORKSPACE/scripts/ci/cronet_material_bootstrap.py" prepare --cronet-root "$HOME/cronet-go"
    - name: Regenerate Debian keyring
      if: matrix.naive
      run: |
        set -xeuo pipefail
        rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
        cd ~/cronet-go
        GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
    - name: Cache Chromium toolchain
      if: matrix.naive
      id: cache-chromium-toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/cronet-go/naiveproxy/src/third_party/llvm-build/
          ~/cronet-go/naiveproxy/src/gn/out/
          ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
        key: chromium-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-musl-${{ hashFiles('.github/CRONET_GO_VERSION', 'release/ci/cronet-material-inputs.json', '.github/patches/cronet-sysroot-transport.patch', 'scripts/ci/cronet_material_bootstrap.py') }}
    - name: Download Chromium toolchain
      if: matrix.naive
      timeout-minutes: 20
      run: |
        set -xeuo pipefail
        if [[ "$POLARIS_DEBIAN_REQUIRED" == "true" ]]; then
          python3 "$GITHUB_WORKSPACE/scripts/ci/cronet_material_supply.py" consume-local \
            --cronet-root "$HOME/cronet-go" --role linux \
            --caller C3_LINUX --target-arch "$MATERIAL_TARGET_ARCH" --libc "$MATERIAL_LIBC" \
            --checkpoint-artifact-id "$CHECKPOINT_ARTIFACT_ID" --checkpoint-artifact-digest "$CHECKPOINT_DIGEST" \
            --output "$RUNNER_TEMP/debian-material-use"
          export POLARIS_CRONET_RAW_STORE="$RUNNER_TEMP/debian-material-use/raw"
        fi
        cd ~/cronet-go
        go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
      env:
        POLARIS_DEBIAN_REQUIRED: ${{ needs.calculate_version.outputs.material_required }}
        CHECKPOINT_ARTIFACT_ID: ${{ inputs.debian_checkpoint_artifact_id }}
        CHECKPOINT_DIGEST: ${{ inputs.debian_checkpoint_digest }}
        MATERIAL_TARGET_ARCH: ${{ matrix.arch }}
        MATERIAL_LIBC: musl
        GH_TOKEN: ${{ github.token }}
    - name: Set Chromium toolchain environment
      if: matrix.naive
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV
    - name: Set build tags
      run: |
        set -xeuo pipefail
        if [[ "${{ matrix.naive }}" == "true" ]]; then
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_musl"
        else
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
        fi
        echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
    - name: Set shared ldflags
      run: |
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.SourceRevision=$GITHUB_SHA" >> "${GITHUB_ENV}"
    - name: Build (naive)
      if: matrix.naive
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
        GOMIPS64: ${{ matrix.gomips }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build (non-naive)
      if: ${{ ! matrix.naive }}
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        GOARM: ${{ matrix.goarm }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Set mtime
      run: TZ=UTC touch -t '197001010000' dist/sing-box
    - name: Set version
      run: |-
        PKG_VERSION="${{ needs.calculate_version.outputs.version }}"
        PKG_VERSION="${PKG_VERSION//-/\~}"
        echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"
    - name: Install shared package tool
      if: matrix.debian != '' || matrix.rpm != '' || matrix.pacman != ''
      run: sudo gem install fpm
    - name: Package DEB
      if: matrix.debian != ''
      run: |
        set -xeuo pipefail
        sudo apt-get install -y debsigs
        cp .fpm_systemd .fpm
        fpm -t deb \
          --name "${PACKAGE_NAME}" \
          -v "$PKG_VERSION" \
          -p "dist/${NAME}_${{ needs.calculate_version.outputs.version }}_linux_${{ matrix.debian }}.deb" \
          --architecture ${{ matrix.debian }} \
          dist/sing-box=/usr/bin/sing-box
    - name: Package RPM
      if: matrix.rpm != ''
      run: |
        set -xeuo pipefail
        echo '%_rpmformat 4' > "$HOME/.rpmmacros"
        cp .fpm_systemd .fpm
        fpm -t rpm \
          --name "${PACKAGE_NAME}" \
          -v "$PKG_VERSION" \
          -p "dist/${NAME}_${{ needs.calculate_version.outputs.version }}_linux_${{ matrix.rpm }}.rpm" \
          --architecture ${{ matrix.rpm }} \
          dist/sing-box=/usr/bin/sing-box
    - name: Cleanup
      run: rm dist/sing-box
    - name: Retain exact Debian material use
      if: ${{ needs.calculate_version.outputs.material_required == 'true' && (matrix.naive) }}
      run: cp "$RUNNER_TEMP/debian-material-use/use.json" dist/debian-material-use.json
    - name: Recheck unsigned candidate source and immutable tag before upload
      run: python3 scripts/ci/linux_candidate_track.py
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
        EXPECTED_TAG_OBJECT: ${{ needs.calculate_version.outputs.tag_object }}
        GH_TOKEN: ${{ github.token }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}
        path: dist
        if-no-files-found: error
  publisher_receipt:
    name: Record complete producer scope
    needs:
    - calculate_version
    - build
    - debian_materials
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 0
    - name: Record exact completed scope
      run: python3 scripts/ci/publisher_run_receipt.py
      env:
        PUBLISHER_ROLE: linux
        NEEDS_JSON: ${{ toJSON(needs) }}
        RECEIPT_EVIDENCE_MODE: final
        RECEIPT_SOURCE_GENERATE_ONLY: 'false'
        RECEIPT_DISTRIBUTION_ENABLED: 'false'
        RECEIPT_PUBLISH_GITHUB: 'false'
        RELEASE_BUILD: All
        RELEASE_VERSION: ${{ inputs.version }}
        PUBLISH_STORES: 'false'
        PUBLISH_REGISTRY: 'false'
        POLARIS_DEBIAN_REQUIRED: ${{ needs.calculate_version.outputs.material_required }}
        POLARIS_DEBIAN_RAW_ID: ${{ needs.debian_materials.outputs.raw_id }}
        POLARIS_DEBIAN_RAW_DIGEST: ${{ needs.debian_materials.outputs.raw_digest }}
        POLARIS_DEBIAN_READY_ID: ${{ needs.debian_materials.outputs.ready_id }}
        POLARIS_DEBIAN_READY_DIGEST: ${{ needs.debian_materials.outputs.ready_digest }}
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@v4
      with:
        name: publisher-run-receipt
        path: publisher-run-receipt.json
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      debian_checkpoint_artifact_id:
        description: Exact completed Materials raw candidate ID; optional resume in Materials, mandatory in Final
        type: string
        required: false
        default: ''
      debian_checkpoint_digest:
        description: Paired immutable candidate ZIP SHA256; same source/tag/plan, no latest or automatic resume
        type: string
        required: false
        default: ''
      version:
        description: Candidate version only; no tag or release will be pushed
        required: true
        type: string
        default: 1.15.0-polaris-alpha.12.17
permissions:
  contents: read
