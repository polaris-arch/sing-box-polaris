name: Dots protocol code generation
on:
  push:
    branches: [collab/dots-audit-remediation-20261017]
    paths:
      - daemon/started_service.proto
      - .github/workflows/dots-protocol-codegen.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install protocol compiler and pinned generators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          GOTOOLCHAIN=local go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          GOTOOLCHAIN=local go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate from frozen schema
        run: |
          echo '6b799d48e267293b38d7aeee6120fffc5bd94f37ec58555f975f1f2f19dc5cbe  daemon/started_service.proto' | sha256sum -c -
          protoc -I . -I /usr/include --go_out=paths=source_relative:. --go-grpc_out=paths=source_relative:. daemon/started_service.proto
          mkdir -p codegen-output
          cp daemon/started_service.pb.go daemon/started_service_grpc.pb.go codegen-output/
          { printf 'source=%s\n' "$GITHUB_SHA"; go version; protoc --version; protoc-gen-go --version; protoc-gen-go-grpc --version; sha256sum daemon/started_service.proto daemon/started_service.pb.go daemon/started_service_grpc.pb.go; } > codegen-output/GENERATION-RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dots-started-service-generated
          path: codegen-output/
          if-no-files-found: error
          retention-days: 7
