name: Full upstream artifacts (unsigned candidate)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-audit-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source_proto:
    name: Generate only runtime protobuf source for review
    if: inputs.build == 'Source' && inputs.source_generate_only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'
        cache: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify scoped generation controls without product execution
      run: python3 -B -m unittest discover -s scripts/ci -p 'test_runtime_proto.py'
    - name: Generate exactly the two runtime-config source files
      run: python3 -B scripts/ci/runtime_proto.py generate --output "${{ runner.temp }}/runtime-protobuf"
    - name: Preserve exact source, tools and generated bytes for review
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-protobuf-${{ github.sha }}
        path: |
          ${{ runner.temp }}/runtime-protobuf/daemon/runtime_config.pb.go
          ${{ runner.temp }}/runtime-protobuf/daemon/runtime_config_grpc.pb.go
          ${{ runner.temp }}/runtime-protobuf/receipt.json
        if-no-files-found: error
        retention-days: 7
  source_gate:
    name: Concentrated G4 and CI source gates (${{ matrix.os }})
    if: inputs.build == 'Source' && !inputs.source_generate_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'
        cache: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install source contract validators
      run: python3 -m pip install PyYAML==6.0.2 jsonschema==4.23.0
    - name: Execute concentrated CI contract controls
      if: matrix.os == 'ubuntu-24.04'
      run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
    - name: Require checked-in runtime protobuf to match the pinned generators
      if: matrix.os == 'ubuntu-24.04'
      run: python3 -B scripts/ci/runtime_proto.py check --output "${{ runner.temp }}/runtime-protobuf-check"
    - name: Preserve the scoped runtime protobuf comparison
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-protobuf-check-${{ github.sha }}
        path: ${{ runner.temp }}/runtime-protobuf-check/receipt.json
        if-no-files-found: error
        retention-days: 7
    - name: Execute actual SDK and fork retirement gates
      run: python3 scripts/ci/g4_candidate.py
  utls_gate:
    name: Concentrated Go and uTLS compatibility (${{ matrix.os }})
    if: inputs.build == 'Source' && !inputs.source_generate_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_BUILD: ${{ inputs.build }}
      SOURCE_GENERATE_ONLY: ${{ inputs.source_generate_only && 'true' || 'false' }}
      SOURCE_RUNNER: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Retain exact Source inputs before compatibility gates (not a test or native PASS)
      run: python -B scripts/ci/utls_cost.py --retain-source-input --output "${{ runner.temp }}/tls-fingerprint-evidence"
    - uses: actions/setup-go@v5
      with:
        go-version-file: release/GO_VERSION
        cache: false
    - name: Install capability schema validator
      run: python -m pip install jsonschema==4.23.0
    - name: Verify raw Vision source checkout semantics on the actual runner
      run: python -B -m unittest discover -s scripts/ci -p 'test_vision_source.py'
    - name: Execute focused runtime coordinator and resource regressions natively
      timeout-minutes: 30
      shell: bash
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/tls-fingerprint-evidence/runtime"
        mkdir -p "$evidence"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
        go test -json -race -p=2 -parallel=2 -count=1 -timeout=15m \
          -tags "$tags" -ldflags "$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.SourceRevision=$GITHUB_SHA" \
          . ./daemon ./experimental/libbox ./experimental/cachefile ./service/api ./adapter ./adapter/inbound ./adapter/outbound \
          ./adapter/endpoint ./adapter/certificate ./common/runtimeclock ./common/certificate \
          ./internal/runtimegraph ./log ./route ./dns/transport/... \
          ./protocol/openconnect ./protocol/openvpn ./protocol/tailscale \
          | tee "$evidence/tests.jsonl"
        test -z "$(git status --porcelain --untracked-files=all)"
    - name: Run raced protocol, crypto and actual selected-core gates
      run: python scripts/ci/utls_gate.py --output "${{ runner.temp }}/tls-fingerprint-evidence/gate"
    - name: Measure whole-migration binary and idle RSS costs
      if: always() && matrix.os == 'ubuntu-24.04'
      continue-on-error: true # Observation result, not an extra product-compatibility gate.
      run: python scripts/ci/utls_cost.py --output "${{ runner.temp }}/tls-fingerprint-evidence/cost"
    - name: Preserve original commands, logs, identities and necessary binaries
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: utls-source-${{ matrix.os }}
        path: ${{ runner.temp }}/tls-fingerprint-evidence
        if-no-files-found: error
        retention-days: 7
  calculate_version:
    if: inputs.build != 'Source' && !inputs.source_generate_only
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      tag_object: ${{ steps.release_source.outputs.tag_object }}
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Calculate version from the dispatched tag
      id: outputs
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        test "$REF_TYPE" = tag
        python3 scripts/ci/polaris_version.py "${REF_NAME#v}"
        echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
    - name: Bind final evidence to annotated dispatch source
      id: release_source
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/release_identity.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
  build:
    name: Build binary
    if: ${{ !inputs.source_generate_only && (inputs.build == 'All' || inputs.build == 'Binary') }}
    runs-on: ubuntu-26.04
    needs:
    - calculate_version
    strategy:
      matrix:
        include:
        - os: linux
          arch: amd64
          variant: purego
          naive: true
        - os: linux
          arch: arm64
          variant: purego
          naive: true
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 1
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache: false
    - name: Set build tags and shared ldflags
      run: |
        echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS),with_purego" >> "${GITHUB_ENV}"
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.SourceRevision=$GITHUB_SHA" >> "${GITHUB_ENV}"
    - name: Build (purego)
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract libcronet.so
      run: |
        set -xeuo pipefail
        CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
        LIBRARY_PATH="lib/${{ matrix.os }}_${{ matrix.arch }}/libcronet.so"
        git init "$RUNNER_TEMP/cronet-go-lib"
        git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
        git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
        git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
        cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/
    - name: Archive
      run: |
        set -xeuo pipefail
        DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
        cd dist
        mkdir -p "${DIR_NAME}"
        cp ../LICENSE "${DIR_NAME}"
        cp ../release/licenses/TLS-DEPENDENCY-NOTICES.txt "${DIR_NAME}"
        cp sing-box libcronet.so "${DIR_NAME}"
        tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
        rm -r "${DIR_NAME}"
    - name: Cleanup
      run: rm -f dist/sing-box dist/libcronet.so
    - name: Record actual unsigned candidate files
      if: success()
      run: python scripts/ci/record_candidate.py dist
      env:
        CANDIDATE_MATRIX_KEY: ${{ github.job }}-${{ strategy.job-index }}
    - name: Collect actual native archive receipt
      run: python scripts/ci/native_release_index.py collect dist
      env:
        VERSION: ${{ needs.calculate_version.outputs.version }}
        NATIVE_MATRIX: ${{ toJSON(matrix) }}
        NATIVE_OS: ${{ matrix.os }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}_${{ matrix.arch }}-${{ matrix.variant }}
        path: dist
        if-no-files-found: error
  build_darwin:
    name: Build Darwin binaries
    if: ${{ !inputs.source_generate_only && (inputs.build == 'All' || inputs.build == 'Binary') }}
    runs-on: xcode-27
    needs:
    - calculate_version
    strategy:
      matrix:
        include:
        - arch: amd64
        - arch: arm64
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 1
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache: false
    - name: Set build tags and shared ldflags
      run: |
        echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS)" >> "${GITHUB_ENV}"
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.SourceRevision=$GITHUB_SHA" >> "${GITHUB_ENV}"
    - name: Build
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: darwin
        GOARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Seal Darwin native candidate before archive
      run: |
        /usr/bin/codesign --force --sign - --timestamp=none dist/sing-box
        /usr/bin/codesign --verify --strict dist/sing-box
    - name: Archive
      env:
        COPYFILE_DISABLE: '1'
      run: |
        set -xeuo pipefail
        DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-darwin-${{ matrix.arch }}"
        cd dist
        mkdir -p "${DIR_NAME}"
        cp ../LICENSE "${DIR_NAME}"
        cp ../release/licenses/TLS-DEPENDENCY-NOTICES.txt "${DIR_NAME}"
        cp sing-box "${DIR_NAME}"
        tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
        rm -r "${DIR_NAME}"
    - name: Cleanup
      run: rm dist/sing-box
    - name: Record actual unsigned candidate files
      if: success()
      run: python scripts/ci/record_candidate.py dist
      env:
        CANDIDATE_MATRIX_KEY: ${{ github.job }}-${{ strategy.job-index }}
    - name: Collect actual native archive receipt
      run: python scripts/ci/native_release_index.py collect dist
      env:
        VERSION: ${{ needs.calculate_version.outputs.version }}
        NATIVE_MATRIX: ${{ toJSON(matrix) }}
        NATIVE_OS: darwin
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-darwin_${{ matrix.arch }}
        path: dist
        if-no-files-found: error
  build_windows:
    name: Build Windows binaries
    if: ${{ !inputs.source_generate_only && (inputs.build == 'All' || inputs.build == 'Binary') }}
    runs-on: windows-latest
    needs:
    - calculate_version
    strategy:
      matrix:
        include:
        - arch: amd64
          naive: true
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 1
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache: false
    - name: Build
      run: |
        $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS
        $LDFLAGS_SHARED = "$(Get-Content release/LDFLAGS) -X github.com/sagernet/sing-box/constant.SourceRevision=$env:GITHUB_SHA"
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" `
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: windows
        GOARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract libcronet.dll
      run: |
        $CRONET_GO_VERSION = Get-Content .github/CRONET_GO_VERSION
        $LIBRARY_PATH = "lib/windows_${{ matrix.arch }}/libcronet.dll"
        git init "$env:RUNNER_TEMP/cronet-go-lib"
        git -C "$env:RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
        git -C "$env:RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
        git -C "$env:RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C "$env:RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
        Copy-Item "$env:RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist
    - name: Archive
      run: |
        $DIR_NAME = "sing-box-${{ needs.calculate_version.outputs.version }}-windows-${{ matrix.arch }}"
        mkdir "dist/$DIR_NAME"
        Copy-Item LICENSE "dist/$DIR_NAME"
        Copy-Item release/licenses/TLS-DEPENDENCY-NOTICES.txt "dist/$DIR_NAME"
        Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME"
        Copy-Item "dist/libcronet.dll" "dist/$DIR_NAME"
        Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
        Remove-Item -Recurse "dist/$DIR_NAME"
    - name: Cleanup
      run: Remove-Item dist/sing-box.exe, dist/libcronet.dll
    - name: Record actual unsigned candidate files
      if: success()
      run: python scripts/ci/record_candidate.py dist
      env:
        CANDIDATE_MATRIX_KEY: ${{ github.job }}-${{ strategy.job-index }}
    - name: Collect actual native archive receipt
      run: python scripts/ci/native_release_index.py collect dist
      env:
        VERSION: ${{ needs.calculate_version.outputs.version }}
        NATIVE_MATRIX: ${{ toJSON(matrix) }}
        NATIVE_OS: windows
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-windows_${{ matrix.arch }}
        path: dist
        if-no-files-found: error
  native_smoke:
    name: Native final-package Cronet and gVisor smoke (${{ matrix.id }})
    if: ${{ !cancelled() && !inputs.source_generate_only && !failure() && (inputs.build == 'All' || inputs.build == 'Binary') }}
    permissions:
      contents: read
      actions: read
    needs:
    - calculate_version
    - build
    - build_darwin
    - build_windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON('{"include":[{"id":"linux-amd64-purego","runner":"ubuntu-24.04","artifact":"binary-linux_amd64-purego"},{"id":"linux-arm64-purego","runner":"ubuntu-24.04-arm","artifact":"binary-linux_arm64-purego"},{"id":"windows-amd64","runner":"windows-2025","artifact":"binary-windows_amd64"},{"id":"darwin-amd64","runner":"macos-15-intel","artifact":"binary-darwin_amd64"},{"id":"darwin-arm64","runner":"xcode-27","artifact":"binary-darwin_arm64"}]}') }}
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Download exact same-run native archive
      uses: actions/download-artifact@v5
      with:
        name: ${{ matrix.artifact }}
        path: native
    - name: Setup source-owned Go for Darwin metadata
      if: startsWith(matrix.id, 'darwin-')
      uses: actions/setup-go@v5
      with:
        go-version-file: release/GO_VERSION
        cache: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native smoke and peer validators
      run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
    - name: Execute final-package Cronet smoke
      env:
        GOTOOLCHAIN: local
      run: python scripts/ci/native_release_index.py smoke native
    - name: Acquire exact same-run Linux artifact metadata without native execution
      if: matrix.id == 'linux-amd64-purego'
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -B scripts/ci/native_peer_metadata.py --native native --output "${{ runner.temp }}/native-peer-admission/admission.json" --failure-output "${{ runner.temp }}/native-controlled-peer-public"
    - name: Execute same-run Linux native Naive and MASQUE controlled peers
      if: matrix.id == 'linux-amd64-purego'
      timeout-minutes: 12
      run: python -B scripts/ci/protocol_peer.py native --admission "${{ runner.temp }}/native-peer-admission/admission.json" --output "${{ runner.temp }}/native-controlled-peer-public"
    - name: Preserve sanitized native peer receipt only
      if: always() && matrix.id == 'linux-amd64-purego'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-controlled-peer
        path: ${{ runner.temp }}/native-controlled-peer-public/receipt.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload actual smoke receipt
      uses: actions/upload-artifact@v4
      with:
        name: smoke-${{ matrix.id }}
        path: native/native-row-*.json
        if-no-files-found: error
  native_index:
    name: Assemble native index and source/legal sidecars
    if: ${{ !inputs.source_generate_only && !failure() && !cancelled() && (inputs.build == 'All' || inputs.build == 'Binary') }}
    needs:
    - calculate_version
    - build
    - build_darwin
    - build_windows
    - native_smoke
    runs-on: ubuntu-latest
    steps:
    - name: Checkout exact source
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install index schema validator
      run: python3 -m pip install jsonschema==4.23.0
    - name: Download exact native scope binary-linux_*
      uses: actions/download-artifact@v5
      with:
        pattern: binary-linux_*
        path: artifacts
    - name: Download exact native scope binary-windows_*
      uses: actions/download-artifact@v5
      with:
        pattern: binary-windows_*
        path: artifacts
    - name: Download exact native scope binary-darwin_*
      uses: actions/download-artifact@v5
      with:
        pattern: binary-darwin_*
        path: artifacts
    - name: Download exact native scope smoke-*
      uses: actions/download-artifact@v5
      with:
        pattern: smoke-*
        path: artifacts
    - name: Assemble final index
      run: python3 scripts/ci/native_release_index.py assemble artifacts
      env:
        VERSION: ${{ needs.calculate_version.outputs.version }}
        EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.calculate_version.outputs.tag_object }}
        GH_TOKEN: ${{ github.token }}
    - name: Upload native index and source sidecar
      uses: actions/upload-artifact@v4
      with:
        name: binary-native-index
        path: |-
          artifacts/polaris-upstream-native-assets.json
          artifacts/sing-box-polaris-source-*.tar.gz
        if-no-files-found: error
    permissions:
      contents: read
      actions: read
  publisher_receipt:
    name: Record complete producer scope
    needs:
    - calculate_version
    - build
    - build_darwin
    - build_windows
    - native_smoke
    - native_index
    if: ${{ always() && inputs.build == 'All' && !inputs.source_generate_only }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 0
    - name: Record exact completed scope
      run: python3 scripts/ci/publisher_run_receipt.py
      env:
        PUBLISHER_ROLE: all
        NEEDS_JSON: ${{ toJSON(needs) }}
        RECEIPT_SOURCE_GENERATE_ONLY: ${{ inputs.source_generate_only && 'true' || 'false' }}
        RELEASE_BUILD: ${{ inputs.build }}
        RELEASE_VERSION: ${{ needs.calculate_version.outputs.version }}
    - uses: actions/upload-artifact@v4
      with:
        name: publisher-run-receipt
        path: publisher-run-receipt.json
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      source_generate_only:
        description: 'Source only: generate the two runtime protobuf files for review; skip native Source validation'
        type: boolean
        default: false
      build:
        description: Release artifact scope (All is unsigned and never publishes)
        required: true
        type: choice
        default: All
        options:
        - All
        - Source
        - Binary
permissions:
  contents: read
