name: Prepare exact Debian raw inputs
description: Authenticate exact profiles, checkpoint complete raw data, then bind READY to its upload.
inputs:
  materials-only:
    description: Independent all-role Materials preparation; optional exact seed or bounded cold acquisition
    required: false
    default: 'false'
  checkpoint-artifact-id:
    description: Optional completed all-role Materials seed ID; absent seed uses bounded authenticated origin acquisition
    required: false
    default: ''
  checkpoint-artifact-digest:
    description: Paired immutable candidate ZIP SHA256; exact source, tag and plan
    required: false
    default: ''
  role:
    required: true
    description: Source-owned all, linux or docker profile union
  tag:
    required: true
    description: Existing exact-source annotated tag
  tag-object:
    required: true
    description: Source preflight's actual annotated object
outputs:
  raw_id:
    description: Actual raw_id from the completed artifact upload
    value: ${{ steps.raw-upload.outputs.artifact-id }}
  raw_digest:
    description: Actual raw_digest from the completed artifact upload
    value: ${{ steps.raw-upload.outputs.artifact-digest }}
  ready_id:
    description: Actual ready_id from the completed artifact upload
    value: ${{ steps.ready-upload.outputs.artifact-id }}
  ready_digest:
    description: Actual ready_digest from the completed artifact upload
    value: ${{ steps.ready-upload.outputs.artifact-digest }}
runs:
  using: composite
  steps:
  - name: Verify exact supplier source and annotated tag
    shell: bash
    env:
      SOURCE_TAG: ${{ inputs.tag }}
      EXPECTED_TAG_OBJECT: ${{ inputs.tag-object }}
    run: python3 scripts/ci/release_identity.py --tag "$SOURCE_TAG" --expected-tag-object "$EXPECTED_TAG_OBJECT"
  - name: Install original creator runtime in the system site
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends python3-requests gpgv gnupg
  - name: Clone and prepare pinned original creator
    shell: bash
    run: |
      set -euo pipefail
      timeout --signal=TERM --kill-after=5s 590s bash -euo pipefail <<'CRONET_CLONE'
      # Keep the monitored PID alive through group KILL when descendants ignore TERM.
      trap 'trap "" TERM; exec sleep inf' TERM
      set -euo pipefail
      CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
      git init ~/cronet-go
      git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
      git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
      git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
      git -C ~/cronet-go checkout FETCH_HEAD
      git -C ~/cronet-go submodule update --init --recursive --depth=1
      python3 "$GITHUB_WORKSPACE/scripts/ci/cronet_material_bootstrap.py" prepare --cronet-root "$HOME/cronet-go"
      CRONET_CLONE
  - name: Regenerate original Debian keyring
    shell: bash
    run: |
      set -euo pipefail
      rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
      cd ~/cronet-go
      GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
  - name: Authenticate every required source profile
    id: prepare
    shell: bash
    env:
      MATERIALS_ONLY: ${{ inputs.materials-only }}
      MATERIAL_ROLE: ${{ inputs.role }}
      CHECKPOINT_ARTIFACT_ID: ${{ inputs.checkpoint-artifact-id }}
      CHECKPOINT_DIGEST: ${{ inputs.checkpoint-artifact-digest }}
    run: |
      set -euo pipefail
      mode_args=()
      if [[ "$MATERIALS_ONLY" == "true" ]]; then
        mode_args=(--materials-only)
      elif [[ "$MATERIALS_ONLY" != "false" ]]; then
        echo "invalid Materials-only selector" >&2
        exit 1
      fi
      checkpoint_args=()
      if [[ -n "$CHECKPOINT_ARTIFACT_ID" || -n "$CHECKPOINT_DIGEST" ]]; then
        checkpoint_args=(--checkpoint-artifact-id "$CHECKPOINT_ARTIFACT_ID" --checkpoint-artifact-digest "$CHECKPOINT_DIGEST")
      fi
      python3 scripts/ci/cronet_material_supply.py prepare --cronet-root "$HOME/cronet-go" --role "$MATERIAL_ROLE" --output "$RUNNER_TEMP/debian-material-raw" "${checkpoint_args[@]}" "${mode_args[@]}"
  - name: Checkpoint complete raw objects even after failed preparation
    id: raw-upload
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: debian-candidate-raw
      path: ${{ runner.temp }}/debian-material-raw
      if-no-files-found: error
      retention-days: 7
      overwrite: false
  - name: Bind READY only after successful authentication and raw upload
    if: success() && steps.prepare.outcome == 'success' && steps.raw-upload.outcome == 'success'
    shell: bash
    env:
      RAW_ID: ${{ steps.raw-upload.outputs.artifact-id }}
      RAW_DIGEST: ${{ steps.raw-upload.outputs.artifact-digest }}
    run: |
      set -euo pipefail
      python3 scripts/ci/cronet_material_supply.py ready --input "$RUNNER_TEMP/debian-material-raw" --raw-artifact-id "$RAW_ID" --raw-artifact-digest "$RAW_DIGEST" --output "$RUNNER_TEMP/debian-material-ready"
  - name: Upload exact READY
    id: ready-upload
    uses: actions/upload-artifact@v4
    with:
      name: debian-material-ready
      path: ${{ runner.temp }}/debian-material-ready/debian-material-ready.json
      if-no-files-found: error
      retention-days: 7
      overwrite: false
