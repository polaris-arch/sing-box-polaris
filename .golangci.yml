version: "2"
run:
  go: "1.27"
  build-tags:
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
    - with_tailscale
    - with_ccm
    - with_ocm
    - badlinkname
    - tfogo_checklinkname0
linters:
  default: none
  enable:
    - ineffassign
    - staticcheck
    - unused
    - modernize
  settings:
    modernize:
      disable:
        - omitzero # nested struct omitempty -> omitzero changes JSON output semantics
    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
        - -SA4023 # impossible nil comparison, false positive on platform-specific implementations
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      # Keep the existing x/net HTTP/2 dialing, ALPN, pooling and close paths.
      # A stdlib transport migration needs separate behavior validation. Limit
      # this temporary exception to these APIs in the 13 reviewed files;
      # every other staticcheck code and every other path stays enabled.
      - linters: [staticcheck]
        path: '^(common/httpclient/http2_(config|fallback_transport|transport)\.go|common/tls/reality_client\.go|transport/http/(client|client_h2_wrap|server|server_h2)\.go|transport/v2raygrpclite/client\.go|transport/v2rayhttp/(client|force_close|force_close_go127|server)\.go)$'
        text: '^SA1019:.*golang\.org/x/net/http2\.'
    paths:
      - transport/simple-obfs
      - \.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
