version: "2"
run:
  go: "1.27"
  build-tags:
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
    - with_tailscale
    - with_ccm
    - with_ocm
    - badlinkname
    - tfogo_checklinkname0
linters:
  default: none
  enable:
    - ineffassign
    - staticcheck
    - unused
    - modernize
  settings:
    modernize:
      disable:
        - omitzero # nested struct omitempty -> omitzero changes JSON output semantics
    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
        - -SA4023 # impossible nil comparison, false positive on platform-specific implementations
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      # Keep the existing x/net HTTP/2 dialing, ALPN, pooling and close paths.
      # A stdlib transport migration needs separate behavior validation. Limit
      # this temporary exception to these APIs in the 15 reviewed files;
      # every other staticcheck code and every other path stays enabled.
      - linters: [staticcheck]
        path: '^(common/httpclient/http2_(config|fallback_transport|transport)\.go|common/tls/reality_client\.go|dns/transport/https_transport\.go|transport/http/(client|client_h2_wrap|server|server_h2)\.go|transport/v2raygrpclite/(client|server)\.go|transport/v2rayhttp/(client|force_close|force_close_go127|server)\.go)$'
        text: '^SA1019:.*golang\.org/x/net/http2\.'
      # Exact reviewed compatibility calls only (Go 1.27.2, x/net v0.59.0,
      # sing-shadowsocks v0.2.9-0.20260929204512-65740e0f0e3e).
      # Rand is a live caller provider: retain its read/join fence. Remove only
      # when the client contract rejects it or pinned engines stop reading it.
      # h2c preserves HTTP/1 Upgrade, including its existing buffering/hijack
      # risks. Remove after an equivalent maintained engine or approved removal
      # of Upgrade, with authentication, lineage and shutdown tests.
      # Metadata is required by encrypted NewPacket parsing/auth/NAT. Remove
      # after a packet API migration preserves tuple and buffer/session custody.
      # Full diagnostic and statement matches leave every other finding enabled.
      # Staticcheck v0.8.2 folds the doc's final newline into one trailing space.
      # Match raw issue.Text exactly, before the v2.15.0 printer trims that space.
      - linters: [staticcheck]
        path: '^common/httpclient/runtime_quic_tls\.go$'
        text: '^SA1019: \(crypto/tls\.Config\)\.Rand has been deprecated since Go 1\.27 and an alternative has been available since Go 1\.26: this should be left nil in production\. Not all TLS configurations are guaranteed to use Rand\. Test code can use \[testing/cryptotest\.SetGlobalRandom\] instead\. $'
        source: '^\s*(?:if value := config\.Rand; value != nil \{|config\.Rand = runtimeQUICReader\{value, fence\})$'
      - linters: [staticcheck]
        path: '^protocol/naive/inbound_runtime_tcp\.go$'
        text: '^SA1019: golang\.org/x/net/http2/h2c is deprecated: This package is deprecated\. It is not maintained and should not be used\. $'
        source: '^\s*(?:"golang\.org/x/net/http2/h2c")$'
      - linters: [staticcheck]
        path: '^protocol/naive/inbound_runtime_tcp\.go$'
        text: '^SA1019: golang\.org/x/net/http2/h2c\.NewHandler is deprecated: Set the \[http\.Server\] Protocols field to use unencrypted HTTP/2 instead\. $'
        source: '^\s*(?:Handler:     h2c\.NewHandler\(n, &http2\.Server\{\}\),)$'
      # The pinned h2c handler also requires this concrete Server type.
      # Retire it with the same reviewed h2c engine migration above.
      - linters: [staticcheck]
        path: '^protocol/naive/inbound_runtime_tcp\.go$'
        text: '^SA1019: golang\.org/x/net/http2\.Server is deprecated: Use \[http\.Server\] instead\. $'
        source: '^\s*(?:Handler:     h2c\.NewHandler\(n, &http2\.Server\{\}\),)$'
      - linters: [staticcheck]
        path: '^protocol/shadowsocks/inbound_runtime_packet\.go$'
        text: '^SA1019: github\.com/sagernet/sing/common/metadata\.Metadata is deprecated: wtf is this\? $'
        source: '^\s*(?:err = h\.service\.NewPacket\(ctx, &stubPacketConn\{h\.listener\.PacketWriter\(\)\}, buffer, M\.Metadata\{Source: source\}\))$'
      # Preserve the public compatibility result order; match only this declaration.
      - linters: [staticcheck]
        path: '^box\.go$'
        text: '^ST1008: error should be returned as the last argument$'
        source: '^func NewWithConstructionReport\(options Options\) \(instance \*Box, err error, report ConstructionReport\) \{$'
    paths:
      - transport/simple-obfs
      - \.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
